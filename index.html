<title>Abflug!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: oben Terminal mit zwei Schlangen, Mitte Gate-Leiste, unten Vorfeld. Ein Look: Flughafen bei Tag. */
:root {
  --asphalt: #4C5763;
  --asphalt-2: #3E4853;
  --terminal: #E3E8EC;
  --ink: #1C2530;
  --board: #15181C;
  --board-text: #FFC83A;
  --signal: #F2C230;
  --card: #FFFFFF;
  --muted: #5D6875;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--asphalt); color: #fff; font-family: var(--font-body); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#app { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; display: block; }
#safe { position: absolute; width: 0; height: 0; padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: calc(8px + env(safe-area-inset-top, 0px)) 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.board { display: flex; align-items: baseline; gap: 10px; min-width: 0; background: var(--board); color: var(--board-text); border: 0; border-radius: 6px; padding: 5px 11px 6px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; box-shadow: 0 2px 0 rgba(0,0,0,.3); cursor: pointer; }
.board-k { font-weight: 800; font-size: 19px; }
.board-v { font-weight: 600; font-size: 15px; color: #F3EFE2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-right { display: flex; gap: 6px; }
.chip, .icon { height: 34px; border: 0; border-radius: 6px; background: var(--board); color: #F3EFE2; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .05em; box-shadow: 0 2px 0 rgba(0,0,0,.3); cursor: pointer; display: grid; place-items: center; }
.chip { padding: 0 10px; color: var(--board-text); white-space: nowrap; }
.chip:disabled { opacity: .35; cursor: default; }
.icon { width: 34px; }
.icon svg { width: 18px; height: 18px; }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.toast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); background: var(--board); color: var(--board-text); font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 16px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
.hint { position: absolute; left: 50%; top: calc(58px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(92vw, 400px); background: rgba(21,24,28,.92); color: #F3EFE2; border-radius: 10px; padding: 10px 14px; font-size: 15px; line-height: 1.35; text-align: center; pointer-events: none; }
.hint b { color: var(--board-text); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(18,23,29,.6); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { width: 100%; max-width: 340px; background: var(--card); color: var(--ink); border-radius: 14px; padding: 22px 20px 20px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.card .eyebrow { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: 13px; color: var(--muted); }
.card h2 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase; letter-spacing: .03em; margin: 6px 0 10px; text-wrap: balance; }
.card p { margin: 0 0 16px; font-size: 15px; line-height: 1.45; color: #36414D; }
.actions { display: grid; gap: 8px; }
.btn { height: 46px; border: 0; border-radius: 8px; font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; background: var(--board); color: var(--board-text); }
.btn.alt { background: #E4E8EC; color: var(--ink); }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
.levels button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 8px; background: var(--board); color: var(--board-text); font-family: var(--font-display); font-weight: 800; font-size: 20px; cursor: pointer; }
.levels button:disabled { background: #D9DEE3; color: #9AA4AE; cursor: default; }
.levels button.cur { outline: 3px solid var(--signal); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div id="app">
  <canvas id="cv" aria-label="Spielfeld: Terminal, Gates und Vorfeld"></canvas>
  <div id="safe"></div>
  <header class="hud">
    <button id="lvlBtn" class="board" aria-label="Level wählen"><span class="board-k">Abflug</span><span id="lvlTxt" class="board-v">Level 01</span></button>
    <div class="hud-right">
      <button id="gateBtn" class="chip" aria-label="Extra-Gate öffnen">+ Gate</button>
      <button id="restartBtn" class="icon" aria-label="Level neu starten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
      <button id="muteBtn" class="icon" aria-label="Ton aus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
    </div>
  </header>
  <div id="toast" class="toast" hidden></div>
  <div id="hint" class="hint" hidden></div>
  <div id="overlay" class="overlay" hidden><div class="card" id="card"></div></div>
</div>

<script id="logic">
// Spiellogik ohne DOM. Wird auch von den Tests geladen.
window.Abflug = (() => {
  const SEATS = { 2: 16, 3: 24, 4: 40 };
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const DKEYS = ["U", "D", "L", "R"];
  const DEST = [
    { id: "ES", name: "Spanien", color: "#F6C028", text: "#2A2205" },
    { id: "IT", name: "Italien", color: "#24A157", text: "#FFFFFF" },
    { id: "GR", name: "Griechenland", color: "#3DB6E8", text: "#06283A" },
    { id: "TR", name: "Türkei", color: "#E3403A", text: "#FFFFFF" },
    { id: "JP", name: "Japan", color: "#F5F3EC", text: "#B0162A" },
    { id: "SE", name: "Schweden", color: "#2453B8", text: "#FFFFFF" },
    { id: "NL", name: "Niederlande", color: "#F28A1E", text: "#2A1604" },
    { id: "MX", name: "Mexiko", color: "#EC5FA8", text: "#FFFFFF" },
    { id: "FR", name: "Frankreich", color: "#8E5BD0", text: "#FFFFFF" },
    { id: "QA", name: "Katar", color: "#7A1B3A", text: "#FFFFFF" },
    { id: "EG", name: "Ägypten", color: "#A8773F", text: "#FFFFFF" },
  ];

  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const grid = (c, r, f) => Array.from({ length: r }, (_, y) => Array.from({ length: c }, (_, x) => !!f(x, y)));
  const art = rows => rows.map(s => [...s].map(ch => ch === "#"));

  // Wartering im Terminal: RING Reihen à 4 Plätze, Position 0 ist der Ausgang zu den Gates.
  const RING = 20, ENTRY = { L: 7, R: 13 };

  const LEVELS = [
    { name: "Ferienstart", mask: grid(6, 8, () => 1), dests: 4, planes: 12, mode: "seq" },
    { name: "Pauschalreise", mask: grid(7, 9, () => 1), dests: 5, planes: 18, mode: "seq" },
    { name: "Brückentag", mask: grid(8, 10, (x, y) => !((x === 0 || x === 7) && (y === 0 || y === 9))), dests: 6, planes: 24, mode: "seq" },
    { name: "Schranken", mask: grid(8, 11, () => 1), dests: 6, planes: 28, mode: "alt" },
    { name: "Jumbo", mask: art([
      "....##....",
      "...####...",
      "...####...",
      "..######..",
      "##########",
      "##########",
      ".########.",
      "...####...",
      "...####...",
      "...####...",
      "..######..",
      "..######..",
    ]), dests: 7, planes: 28, mode: "alt" },
    { name: "Nebel", mask: grid(11, 11, (x, y) => Math.abs(x - 5) + Math.abs(y - 5) <= 6), dests: 7, planes: 30, mode: "alt", mystery: 0.25 },
    { name: "Hangar", mask: grid(9, 12, () => 1), dests: 8, planes: 38, mode: "alt", hangars: 1, hangarSize: 4 },
    { name: "Koffer", mask: art([
      "...####...",
      "...#..#...",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
    ]), dests: 8, planes: 40, mode: "alt", mystery: 0.25, hangars: 1, hangarSize: 4 },
    { name: "Weltreise", mask: grid(11, 12, (x, y) => ((x - 5) / 5.6) ** 2 + ((y - 5.5) / 6.1) ** 2 <= 1), dests: 9, planes: 36, mode: "alt", mystery: 0.3 },
    { name: "Tower", mask: art([
      "..######..",
      ".########.",
      "##########",
      "##########",
      ".########.",
      "...####...",
      "...####...",
      "...####...",
      "..######..",
      ".########.",
      "##########",
      "##########",
      "##########",
    ]), dests: 10, planes: 42, mode: "alt", mystery: 0.3, hangars: 2, hangarSize: 4 },
  ];

  // Flugzeug: (x, y) ist die Nase, der Rumpf liegt entgegen der Richtung.
  function cellsOf(p) {
    const [dx, dy] = DIRS[p.dir], out = [];
    for (let k = 0; k < p.len; k++) out.push([p.x - k * dx, p.y - k * dy]);
    return out;
  }
  function pathOf(p, cols, rows) {
    const [dx, dy] = DIRS[p.dir], out = [];
    let x = p.x + dx, y = p.y + dy;
    while (x >= 0 && y >= 0 && x < cols && y < rows) { out.push([x, y]); x += dx; y += dy; }
    return out;
  }

  // Rückwärts bauen: Jedes neue Flugzeug braucht freie Bahn an allen bisherigen vorbei.
  // Damit ist die umgekehrte Reihenfolge immer eine gültige Lösung fürs Vorfeld.
  function tryGen(L, r) {
    const rows = L.mask.length, cols = L.mask[0].length;
    const occ = Array.from({ length: rows }, () => Array(cols).fill(null));
    const inMask = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows && L.mask[y][x];
    const hangars = [];
    for (let h = 0; h < (L.hangars || 0); h++) {
      for (let t = 0; t < 400; t++) {
        const x = (r() * cols) | 0, y = (r() * rows) | 0, dir = DKEYS[(r() * 4) | 0];
        const [dx, dy] = DIRS[dir];
        if (!inMask(x, y) || !inMask(x + dx, y + dy) || !inMask(x + 2 * dx, y + 2 * dy)) continue;
        const ray = [];
        let cx = x, cy = y, ok = true;
        while (cx >= 0 && cy >= 0 && cx < cols && cy < rows) {
          if (occ[cy][cx] !== null) { ok = false; break; }
          ray.push([cx, cy]); cx += dx; cy += dy;
        }
        if (!ok || ray.length < 4) continue;
        occ[y][x] = "H";
        ray.slice(1).forEach(([a, b]) => (occ[b][a] = "R"));
        hangars.push({ x, y, dir });
        break;
      }
    }
    const hangarPlanes = hangars.length * (L.hangarSize || 0);
    const target = L.planes - hangarPlanes;
    const lens = [2, 2, 2, 2, 3, 3, 3, 4, 4];
    const base = [];
    for (let t = 0; t < 14000 && base.length < target; t++) {
      const p = { x: (r() * cols) | 0, y: (r() * rows) | 0, dir: DKEYS[(r() * 4) | 0], len: lens[(r() * lens.length) | 0] };
      const cells = cellsOf(p);
      if (!cells.every(([a, b]) => inMask(a, b) && occ[b][a] === null)) continue;
      if (pathOf(p, cols, rows).some(([a, b]) => occ[b][a] === "H" || typeof occ[b][a] === "number")) continue;
      const i = base.length;
      base.push(p);
      cells.forEach(([a, b]) => (occ[b][a] = i));
    }
    if (base.length < 3) return null;

    const planes = base.map((p, i) => ({ id: i, ...p, hangar: -1, mystery: false }));
    hangars.forEach((h, hi) => {
      const [dx, dy] = DIRS[h.dir];
      h.queue = [];
      for (let k = 0; k < L.hangarSize; k++) {
        const p = { id: planes.length, x: h.x + 2 * dx, y: h.y + 2 * dy, dir: h.dir, len: 2, hangar: hi, mystery: false };
        planes.push(p); h.queue.push(p.id);
      }
    });
    const dests = planes.map((_, i) => (i < L.dests ? i : (r() * L.dests) | 0));
    for (let i = dests.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; [dests[i], dests[j]] = [dests[j], dests[i]]; }
    planes.forEach((p, i) => (p.dest = dests[i]));
    if (L.mystery) base.forEach((_, i) => (planes[i].mystery = r() < L.mystery));

    // Lösungsreihenfolge inkl. Hangar-Flugzeuge, die gerade im Weg stehen.
    const cur = hangars.map(h => { const q = [...h.queue]; return { q, p: q.shift() }; });
    const sol = [];
    const take = hi => { sol.push(cur[hi].p); cur[hi].p = cur[hi].q.length ? cur[hi].q.shift() : undefined; };
    for (let bi = base.length - 1; bi >= 0; bi--) {
      if (cur.length && r() < 0.25) { const hi = (r() * cur.length) | 0; if (cur[hi].p !== undefined) take(hi); }
      const keys = new Set(pathOf(base[bi], cols, rows).map(([a, b]) => a + "," + b));
      for (;;) {
        const hi = cur.findIndex(c => c.p !== undefined && cellsOf(planes[c.p]).some(([a, b]) => keys.has(a + "," + b)));
        if (hi < 0) break;
        take(hi);
      }
      sol.push(bi);
    }
    cur.forEach((c, hi) => { while (c.p !== undefined) take(hi); });

    // Schlange bauen: so, dass drei Gates für diese Reihenfolge reichen. Gespielt wird mit vier.
    const gates = [], seq = [];
    let i = 0;
    while (i < sol.length || gates.length) {
      while (gates.length < 3 && i < sol.length) { const p = planes[sol[i++]]; gates.push({ p, left: SEATS[p.len] }); }
      const ds = [...new Set(gates.map(g => g.p.dest))];
      const d = ds[(r() * ds.length) | 0];
      const g = gates.find(g => g.p.dest === d);
      const n = Math.min(g.left, r() < 0.55 ? 8 : 16);
      g.left -= n;
      const last = seq[seq.length - 1];
      if (last && last.dest === d) last.n += n; else seq.push({ dest: d, n });
      if (!g.left) gates.splice(gates.indexOf(g), 1);
    }
    const arms = { L: [], R: [] };
    if (L.mode === "seq") {
      const total = seq.reduce((s, g) => s + g.n, 0);
      let acc = 0;
      seq.forEach(g => { (acc < total / 2 ? arms.L : arms.R).push(g); acc += g.n; });
    } else {
      seq.forEach((g, k) => (k % 2 ? arms.R : arms.L).push(g));
    }
    return {
      name: L.name, cols, rows, mask: L.mask, mode: L.mode, planes,
      hangars: hangars.map(h => ({ x: h.x, y: h.y, dir: h.dir, queue: h.queue })),
      arms, sol, tourists: seq.reduce((s, g) => s + g.n, 0),
    };
  }

  function createState(lv) {
    const planes = lv.planes.map(p => ({ ...p, where: p.hangar >= 0 ? "hangar" : "apron", seatsLeft: SEATS[p.len], gate: -1, revealed: !p.mystery }));
    const hangars = lv.hangars.map(h => ({ x: h.x, y: h.y, dir: h.dir, queue: [...h.queue] }));
    hangars.forEach(h => { planes[h.queue.shift()].where = "apron"; });
    const st = {
      cols: lv.cols, rows: lv.rows, mask: lv.mask, mode: lv.mode, planes, hangars,
      gates: [null, null, null, null, null], gateCount: 4,
      arms: { L: { groups: lv.arms.L.map(g => ({ ...g })), taken: 0 }, R: { groups: lv.arms.R.map(g => ({ ...g })), taken: 0 } },
      active: "L", boarded: 0,
      ring: new Array(RING * 4).fill(-1), off: 0,
    };
    if (!st.arms.L.groups.length) st.active = "R";
    reveal(st);
    return st;
  }
  function occMap(st) {
    const m = new Map();
    st.planes.forEach(p => { if (p.where === "apron") cellsOf(p).forEach(([x, y]) => m.set(x + "," + y, p.id)); });
    st.hangars.forEach(h => m.set(h.x + "," + h.y, -1));
    return m;
  }
  // -1: Weg frei. Sonst Anzahl freier Felder bis zum Hindernis.
  function freeRun(st, p, m = occMap(st)) {
    const path = pathOf(p, st.cols, st.rows);
    for (let k = 0; k < path.length; k++) if (m.has(path[k][0] + "," + path[k][1])) return k;
    return -1;
  }
  function reveal(st) {
    const m = occMap(st);
    st.planes.forEach(p => { if (p.where === "apron" && !p.revealed && freeRun(st, p, m) < 0) p.revealed = true; });
  }
  function tap(st, id) {
    const p = st.planes[id];
    if (!p || p.where !== "apron") return { ok: false, reason: "none" };
    const k = freeRun(st, p);
    if (k >= 0) return { ok: false, reason: "blocked", free: k };
    let g = -1;
    for (let i = 0; i < st.gateCount; i++) if (st.gates[i] === null) { g = i; break; }
    if (g < 0) return { ok: false, reason: "gates" };
    p.where = "taxi"; p.gate = g; p.revealed = true; st.gates[g] = id;
    let spawned = null;
    if (p.hangar >= 0) {
      const h = st.hangars[p.hangar];
      if (h.queue.length) { spawned = h.queue.shift(); st.planes[spawned].where = "apron"; }
    }
    reveal(st);
    return { ok: true, gate: g, spawned };
  }
  function arrive(st, id) { const p = st.planes[id]; if (p.where === "taxi") p.where = "gate"; }
  function frontArm(st) {
    let a = st.arms[st.active];
    if (!a.groups.length) {
      const o = st.active === "L" ? "R" : "L";
      if (st.arms[o].groups.length) { st.active = o; a = st.arms[o]; }
    }
    return a.groups.length ? a : null;
  }
  function rowAt(st, pos) { return (((pos - st.off) % RING) + RING) % RING; }
  function gatePlaneFor(st, dest) {
    for (let i = 0; i < st.gateCount; i++) {
      const id = st.gates[i];
      if (id === null) continue;
      const p = st.planes[id];
      if (p.where === "gate" && p.dest === dest && p.seatsLeft > 0) return p;
    }
    return null;
  }
  // Ein Schritt: Der Ring rückt eine Reihe weiter. Am Ausgang steigt ein, wer ein passendes
  // Flugzeug am Gate hat. Am offenen Zulauf rücken Touristen in freie Plätze nach.
  function tick(st) {
    st.off = (st.off + 1) % RING;
    const boards = [];
    const j0 = rowAt(st, 0);
    for (let c = 0; c < 4; c++) {
      const k = j0 * 4 + c, d = st.ring[k];
      if (d < 0) continue;
      const p = gatePlaneFor(st, d);
      if (!p) continue;
      st.ring[k] = -1; p.seatsLeft--; st.boarded++;
      if (!p.seatsLeft) p.where = "full";
      boards.push({ plane: p.id, dest: d, lane: c, full: !p.seatsLeft });
    }
    let entered = null;
    const a = frontArm(st);
    if (a) {
      const side = st.active, j = rowAt(st, ENTRY[side]), before = a.taken;
      for (let c = 0; c < 4 && a.groups.length; c++) {
        const k = j * 4 + c;
        if (st.ring[k] >= 0) continue;
        const grp = a.groups[0];
        st.ring[k] = grp.dest; grp.n--; a.taken++;
        if (!grp.n) {
          a.groups.shift();
          const o = side === "L" ? "R" : "L";
          if ((st.mode === "alt" && st.arms[o].groups.length) || !a.groups.length) { st.active = o; break; }
        }
      }
      if (a.taken > before) entered = { side, before, after: a.taken };
    }
    return { boards, entered };
  }
  function depart(st, id) { const p = st.planes[id]; st.gates[p.gate] = null; p.where = "gone"; }
  function status(st) {
    const queued = st.arms.L.groups.length + st.arms.R.groups.length;
    if (!queued && st.ring.every(d => d < 0) && st.planes.every(p => p.where === "gone")) return "win";
    if (st.planes.some(p => p.where === "taxi" || p.where === "full")) return "busy";
    const gd = new Set();
    for (let i = 0; i < st.gateCount; i++) if (st.gates[i] !== null) gd.add(st.planes[st.gates[i]].dest);
    if (st.ring.some(d => d >= 0 && gd.has(d))) return "boarding";
    for (let i = 0; i < st.gateCount; i++) if (st.gates[i] === null) return "play";
    if (queued && st.ring.some(d => d < 0)) return "filling";
    return "lose";
  }

  // Spielt die Lösungsreihenfolge stur durch: so früh wie möglich losrollen, sonst Ring laufen lassen.
  function solve(lv) {

})();

<script>
(() => {

  const INTRO = {
    0: "Tippe ein Flugzeug an. Ist der Weg vor der Nase frei, rollt es zu einem <b>Gate</b>. Die Touristen laufen im Kreis und steigen am Ausgang ein, wenn ihr Flugzeug wartet.",
    3: "<b>Neu: Schranken.</b> Die beiden Eingänge öffnen abwechselnd, Gruppe für Gruppe.",
    5: "<b>Neu: Ziel unbekannt.</b> Graue Flugzeuge zeigen ihr Ziel, sobald ihr Weg frei ist.",

  let W = 0, H = 0, DPR = 1, lay = null;

  // ---------- Farben und Formen ----------

  }

      case "ES": f("#C60B1E", x, y, w, h); f("#FFC400", x, y + h * 0.25, w, h * 0.5); break;
      case "IT": f("#009246", x, y, w / 3 + 0.5, h); f("#FFFFFF", x + w / 3, y, w / 3 + 0.5, h); f("#CE2B37", x + (2 * w) / 3, y, w / 3 + 0.5, h); break;
      case "GR":

      case "TR":

        ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(x + w * 0.38, y + h / 2, h * 0.28, 0, 7); ctx.fill();
        ctx.fillStyle = "#E30A17"; ctx.beginPath(); ctx.arc(x + w * 0.44, y + h / 2, h * 0.225, 0, 7); ctx.fill();
        ctx.fillStyle = "#FFFFFF"; star(x + w * 0.64, y + h / 2, h * 0.12);

      case "JP": f("#FFFFFF", x, y, w, h); ctx.fillStyle = "#BC002D"; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, h * 0.3, 0, 7); ctx.fill(); break;
      case "SE": f("#006AA7", x, y, w, h); f("#FECC00", x + w * 0.31, y, w * 0.125, h); f("#FECC00", x, y + h * 0.4, w, h * 0.2); break;
      case "NL": f("#AE1C28", x, y, w, h / 3 + 0.5); f("#FFFFFF", x, y + h / 3, w, h / 3 + 0.5); f("#21468B", x, y + (2 * h) / 3, w, h / 3 + 0.5); break;
      case "FR": f("#002654", x, y, w / 3 + 0.5, h); f("#FFFFFF", x + w / 3, y, w / 3 + 0.5, h); f("#CE1126", x + (2 * w) / 3, y, w / 3 + 0.5, h); break;
      case "MX":
        f("#006847", x, y, w / 3 + 0.5, h); f("#FFFFFF", x + w / 3, y, w / 3 + 0.5, h); f("#CE1126", x + (2 * w) / 3, y, w / 3 + 0.5, h);
        ctx.fillStyle = "#8C5A2B"; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, h * 0.16, 0, 7); ctx.fill();
        break;
      case "QA":
        f("#8A1538", x, y, w, h); f("#FFFFFF", x, y, w * 0.26, h);
        ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.moveTo(x + w * 0.26, y);

  }
  function star(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }
  function planeShape(c, len) {
    const half = (len * c * 0.92) / 2, fw = c * (0.25 + len * 0.025);
    ctx.beginPath();
    // Flügel
    ctx.moveTo(half * 0.22, -fw * 0.4); ctx.lineTo(-half * 0.14, -c * 0.47); ctx.lineTo(-half * 0.34, -c * 0.47); ctx.lineTo(-half * 0.2, -fw * 0.4);
    ctx.lineTo(-half * 0.2, fw * 0.4); ctx.lineTo(-half * 0.34, c * 0.47); ctx.lineTo(-half * 0.14, c * 0.47); ctx.lineTo(half * 0.22, fw * 0.4);

    ctx.moveTo(-half * 0.68, -fw * 0.3); ctx.lineTo(-half * 0.9, -c * 0.22); ctx.lineTo(-half * 1.0, -c * 0.22); ctx.lineTo(-half * 0.95, -fw * 0.3);
    ctx.lineTo(-half * 0.95, fw * 0.3); ctx.lineTo(-half * 1.0, c * 0.22); ctx.lineTo(-half * 0.9, c * 0.22); ctx.lineTo(-half * 0.68, fw * 0.3);

  }
  function fuselage(half, fw) {
    ctx.beginPath();

  function drawPlane(x, y, ang, c, p, alpha = 1, lift = 0) {
    const mystery = !p.revealed;

    ctx.globalAlpha = alpha;

    ctx.translate(x, y); ctx.rotate(ang);
    const { half, fw } = planeShape(c, p.len);
    ctx.fillStyle = shade(body, -0.1); ctx.strokeStyle = edge; ctx.lineWidth = Math.max(1, c * 0.03);

    ctx.fillStyle = shade(body, -0.3);

  // ---------- Pfade ----------

  // ---------- Layout ----------
  function layout() {

    cv.style.width = W + "px"; cv.style.height = H + "px";
    for (const k in sprites) delete sprites[k];
    if (!S) return;
    const hudB = $(".hud").getBoundingClientRect().bottom;
    const sab = parseFloat(getComputedStyle($("#safe")).paddingBottom) || 0;
    const gw = Math.min(W, 520), ox = (W - gw) / 2, top = hudB + 2;
    const avail = H - top - sab - 10;
    const termH = Math.round(Math.max(190, Math.min(avail * 0.3, 260)));
    const gatesH = Math.round(Math.max(84, Math.min(avail * 0.17, 122)));
    const apronTop = top + termH + gatesH + 12;
    const apronH = H - sab - 12 - apronTop;
    const cell = Math.max(16, Math.floor(Math.min((gw - 28) / S.cols, apronH / S.rows, 64)));
    const ax = ox + (gw - cell * S.cols) / 2, ay = apronTop + Math.max(0, apronH - cell * S.rows) * 0.3;

    // Wartering als Stadion, Ausgang unten in der Mitte. Zuläufe kommen von oben.

    const laneW = 4 * d + 6, cx = ox + gw / 2;
    // Umfang so knapp, dass die Reihen dicht an dicht laufen.
    const rr = laneW * 0.85;
    const straight = Math.max(10, (A.RING * d * 1.45 - 2 * Math.PI * rr) / 2);
    const cyR = top + termH - 16 - laneW / 2 - rr;
    const x0 = cx - straight / 2, x1 = cx + straight / 2;
    const pts = [[cx, cyR + rr], [x0, cyR + rr]];
    for (let k = 1; k <= 18; k++) { const a = Math.PI / 2 + (Math.PI * k) / 18; pts.push([x0 + rr * Math.cos(a), cyR + rr * Math.sin(a)]); }
    pts.push([x1, cyR - rr]);
    for (let k = 1; k <= 18; k++) { const a = -Math.PI / 2 + (Math.PI * k) / 18; pts.push([x1 + rr * Math.cos(a), cyR + rr * Math.sin(a)]); }

    const eL = at(ring, (A.ENTRY.L / A.RING) * ring.total), eR = at(ring, (A.ENTRY.R / A.RING) * ring.total);
    const armTop = top + 16;
    const arms = {
      L: poly([[eL.x, eL.y - laneW / 2 - 3], [eL.x, armTop]]),
      R: poly([[eR.x, eR.y - laneW / 2 - 3], [eR.x, armTop]]),

    const gy0 = top + termH;
    const slotW = Math.min((gw - 24) / 5, 82), slotH = gatesH - 30;
    const gc = Math.min(slotH / 3.85, slotW * 0.92);
    const gates = [0, 1, 2, 3, 4].map(i => ({ x: cx + (i - 2) * slotW, y: gy0 + 8 + slotH / 2 }));
    lay = {
      ox, gw, top, termH, gatesH, gy0, slotW, slotH, gc, gates, cell, ax, ay, d, laneW, cx, arms,
      ring, rr, cyR, x0, x1, exit: { x: cx, y: cyR + rr },
      capRows: { L: Math.min(6, Math.floor((arms.L.total - d) / d)), R: Math.min(6, Math.floor((arms.R.total - d) / d)) },

  }

  // ---------- Level ----------
  function startLevel(i) {

  function planeCenter(p) {

  }
  function taxiPath(p) {

  // ---------- Ablauf ----------
  function update(t, dt) {

    while (ringT >= TICK) {

      const r = A.tick(S);

        const p = S.planes[b.plane], gp = lay.gates[p.gate];

          x0: lay.exit.x + (b.lane - 1.5) * lay.d, y0: lay.exit.y, x1: gp.x, y1: gp.y, t0: t + b.lane * 0.03,
          dest: b.dest, gate: p.gate, fill: 1 - p.seatsLeft / A.SEATS[p.len], full: b.full,
        });
        if (b.full) vis.set(b.plane, { kind: "full", t0: t });
      }
      if (r.entered) shift[r.entered.side] += ((r.entered.after >> 2) - (r.entered.before >> 2)) * lay.d;
    }
    // Landet ein Tourist im Flugzeug: Plopp, Flugzeug federt, Zähler hüpft.
    flyers = flyers.filter(f => {
      if (t - f.t0 < FLY) return true;
      pulse[f.gate] = t;
      if (t - lastPlop > 0.025) { sfx.board(f.fill); lastPlop = t; }
      if (f.full) sfx.full();
      return false;
    });
    for (const [id, v] of vis) {
      if (v.kind === "full" && t - v.t0 > FULL_WAIT) {
        const p = S.planes[id], gp = lay.gates[p.gate];
        A.depart(S, id); vis.delete(id);
        departing.push({ p, x: gp.x, y: gp.y, t0: t });
        sfx.whoosh();
      }
    }
    departing = departing.filter(d => t - d.t0 < 1.4);
    const k = Math.exp(-dt * 12);
    shift.L *= k; shift.R *= k;
    if (!ended && !flyers.length && ![...vis.values()].some(v => v.kind === "taxi" || v.kind === "full")) {
      const s = A.status(S);
      if (s === "win") finish(true);
      else if (s === "lose") finish(false);
    }
  }

  function finish(won) {
    ended = true;
    setTimeout(() => {
      if (won) {
        maxLevel = Math.max(maxLevel, levelIdx + 1);
        store.set("abflug.max", maxLevel);
        sfx.win();
        const lastLvl = levelIdx >= A.LEVELS.length - 1;
        showCard(`
          <div class="eyebrow">Level ${levelIdx + 1} geschafft</div>
          <h2>Alle im Urlaub!</h2>
          <p>${lv.tourists} Touristen sind in ${lv.planes.length} Flugzeugen abgeflogen.</p>
          <div class="actions">
            ${lastLvl ? `<p><b>Alle ${A.LEVELS.length} Level geschafft.</b></p>` : `<button class="btn" id="nextBtn">Weiter zu Level ${levelIdx + 2}</button>`}
            <button class="btn alt" id="againBtn">Nochmal spielen</button>
          </div>`);
        $("#nextBtn")?.addEventListener("click", () => startLevel(levelIdx + 1));
        $("#againBtn").addEventListener("click", () => startLevel(levelIdx));
      } else {
        sfx.lose();
        const canGate = S.gateCount < 5;
        showCard(`
          <div class="eyebrow">Level ${levelIdx + 1}</div>
          <h2>Abflug verzögert</h2>
          <p>Alle Gates sind belegt, und im Wartebereich will niemand zu einem der wartenden Ziele.</p>
          <div class="actions">
            ${canGate ? `<button class="btn" id="extraBtn">Extra-Gate öffnen</button>` : ""}
            <button class="btn ${canGate ? "alt" : ""}" id="againBtn">Level neu starten</button>
          </div>`);
        $("#extraBtn")?.addEventListener("click", () => { openExtraGate(); $("#overlay").hidden = true; ended = false; });
        $("#againBtn").addEventListener("click", () => startLevel(levelIdx));
      }
    }, won ? 700 : 350);
  }
  function openExtraGate() {
    if (!S || S.gateCount >= 5) return;
    S.gateCount = 5; $("#gateBtn").disabled = true; sfx.go();
  }

  // ---------- Zeichnen ----------
  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#4C5763"; ctx.fillRect(0, 0, W, H);
    if (!S || !lay) return;
    drawTerminal(t);
    drawGates(t);
    drawApron(t);
    // Rollende Flugzeuge
    for (const [id, v] of vis) {
      if (v.kind !== "taxi") continue;
      const p = S.planes[id];
      const s = Math.min(1, (t - v.t0) / v.dur), e = s < 0.5 ? 2 * s * s : 1 - (-2 * s + 2) ** 2 / 2;
      const dist = e * v.pl.total, pt = at(v.pl, dist), ahead = at(v.pl, dist + 6);
      const ang = dist >= v.pl.total - 1 ? -Math.PI / 2 : Math.atan2(ahead.y - pt.y, ahead.x - pt.x) || pt.a;
      const k = Math.max(0, Math.min(1, (dist - v.firstLen) / Math.max(1, v.pl.total - v.firstLen)));
      drawPlane(pt.x, pt.y, ang, lay.cell + (lay.gc - lay.cell) * k, p);
    }
    // Fliegende Touristen
    for (const f of flyers) {
      if (t < f.t0) continue;
      const s = Math.min(1, (t - f.t0) / FLY), e = s * s * (3 - 2 * s);
      const x = f.x0 + (f.x1 - f.x0) * e, y = f.y0 + (f.y1 - f.y0) * e - Math.sin(s * Math.PI) * 30;
      const d = lay.d * (1.15 - s * 0.5);
      ctx.drawImage(ballSprite(f.dest, lay.d), x - d / 2, y - d / 2, d, d);
    }
    // Startende Flugzeuge über allem
    for (const d of departing) {
      const s = (t - d.t0) / 1.4, y = d.y - (d.y + 120) * s * s * 1.05;
      const alpha = s < 0.7 ? 1 : Math.max(0, 1 - (s - 0.7) / 0.3);
      drawPlane(d.x, y, -Math.PI / 2, lay.gc * (1 + s * 1.3), d.p, alpha, s);
    }
  }

  function drawTerminal(t) {
    const { ox, gw, top, termH } = lay;
    ctx.fillStyle = "#E3E8EC"; ctx.fillRect(0, 0, W, top + termH);
    ctx.strokeStyle = "rgba(40,60,80,.06)"; ctx.lineWidth = 1;
    for (let x = ox % 26; x < W; x += 26) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, top + termH); ctx.stroke(); }
    for (let y = 0; y < top + termH; y += 26) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }
    // Glasfront
    ctx.fillStyle = "#9CB4C5"; ctx.fillRect(0, top + termH - 5, W, 5);
    ctx.fillStyle = "#7F98AA"; for (let x = ox % 44; x < W; x += 44) ctx.fillRect(x, top + termH - 5, 2, 5);
    // Durchgang vom Ring zu den Gates
    const ex = lay.exit;
    ctx.fillStyle = "#CBD3DA"; rrect(ex.x - lay.laneW / 2 + 4, ex.y, lay.laneW - 8, top + termH - ex.y, 4); ctx.fill();
    ctx.strokeStyle = "#F2C230"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
    const cy0 = ex.y + lay.laneW / 2 + 2;
    for (let y = cy0; y < top + termH - 8; y += 10) {
      ctx.beginPath(); ctx.moveTo(ex.x - 5, y); ctx.lineTo(ex.x, y + 5); ctx.lineTo(ex.x + 5, y); ctx.stroke();
    }
    for (const side of ["L", "R"]) drawArm(side, t);
    // Wartering
    const ring = lay.ring, d = lay.d;
    ctx.beginPath(); ring.points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
    ctx.strokeStyle = "#A9B4BE"; ctx.lineWidth = lay.laneW + 6; ctx.stroke();
    ctx.strokeStyle = "#D2D9DF"; ctx.lineWidth = lay.laneW; ctx.stroke();
    // Insel in der Mitte
    const ir = lay.rr - lay.laneW / 2 - 4;
    if (ir > 6) {
      ctx.fillStyle = "#8DB07A"; rrect(lay.x0 - ir, lay.cyR - ir, lay.x1 - lay.x0 + 2 * ir, 2 * ir, ir); ctx.fill();
      ctx.fillStyle = "#6E9460"; rrect(lay.x0 - ir + 4, lay.cyR - ir + 4, lay.x1 - lay.x0 + 2 * ir - 8, 2 * ir - 8, ir - 4); ctx.fill();
      if (lay.x1 - lay.x0 + 2 * ir > 64) {
        ctx.fillStyle = "#F4F1E6"; ctx.font = `800 12px "Barlow Condensed", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("DUTY FREE", lay.cx, lay.cyR);
      }
    }
    // Touristen laufen im Kreis
    const frac = Math.min(1, ringT / TICK);
    for (let j = 0; j < A.RING; j++) {
      const pt = at(ring, (((j + S.off + frac) % A.RING) / A.RING) * ring.total);
      for (let c = 0; c < 4; c++) {
        const dd = S.ring[j * 4 + c];
        if (dd < 0) continue;
        const off = (c - 1.5) * d, x = pt.x - Math.sin(pt.a) * off, y = pt.y + Math.cos(pt.a) * off;
        ctx.drawImage(ballSprite(dd, d), x - d / 2, y - d / 2, d, d);
      }
    }
    for (const side of ["L", "R"]) drawBarrier(side);
  }

  function drawArm(side, t) {
    const pl = lay.arms[side], arm = S.arms[side], d = lay.d;
    ctx.lineCap = "butt"; ctx.lineJoin = "round";
    ctx.beginPath(); pl.points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.strokeStyle = "#A9B4BE"; ctx.lineWidth = lay.laneW + 6; ctx.stroke();
    ctx.strokeStyle = "#D2D9DF"; ctx.lineWidth = lay.laneW; ctx.stroke();
    // Nur die nächsten Reihen sind zu sehen, der Rest wartet am Check-in.
    let idx = arm.taken % 4, drawn = 0, total = 0;
    const cap = lay.capRows[side];
    for (const g of arm.groups) {
      total += g.n;
      const spr = ballSprite(g.dest, d);
      for (let k = 0; k < g.n; k++, idx++) {
        const row = idx >> 2;
        if (row >= cap) continue;
        const pt = at(pl, row * d + d / 2 + 4 + shift[side]);
        const off = ((idx & 3) - 1.5) * d;
        const x = pt.x - Math.sin(pt.a) * off, y = pt.y + Math.cos(pt.a) * off;
        ctx.drawImage(spr, x - d / 2, y - d / 2, d, d);
        drawn++;
      }
    }
    const topY = at(pl, cap * d + 10).y;
    ctx.fillStyle = "#15181C"; rrect(pl.points[0][0] - lay.laneW / 2 - 3, topY - 14, lay.laneW + 6, 16, 4); ctx.fill();
    ctx.fillStyle = "#FFC83A"; ctx.font = `700 12px "Barlow Condensed", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(total > drawn ? "+" + (total - drawn) : "CHECK-IN", pl.points[0][0], topY - 5);
  }

  function drawBarrier(side) {
    const pl = lay.arms[side], arm = S.arms[side];
    // Schranke am Eingang
    const p0 = at(pl, 0), nx = -Math.sin(p0.a), ny = Math.cos(p0.a), hw = lay.laneW / 2 + 3;
    const open = S.active === side && arm.groups.length > 0;
    const bx = p0.x - Math.cos(p0.a) * 2, by = p0.y - Math.sin(p0.a) * 2;
    const px = bx + nx * hw, py = by + ny * hw;
    if (open) {
      ctx.strokeStyle = "rgba(60,70,80,.35)"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(p0.a) * -lay.laneW * 0.45, py + Math.sin(p0.a) * -lay.laneW * 0.45); ctx.stroke();
    } else {
      const ex = bx - nx * hw, ey = by - ny * hw;
      for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = i % 2 ? "#FFFFFF" : "#D9312B"; ctx.lineWidth = 5; ctx.lineCap = "butt";
        ctx.beginPath(); ctx.moveTo(px + (ex - px) * (i / 6), py + (ey - py) * (i / 6)); ctx.lineTo(px + (ex - px) * ((i + 1) / 6), py + (ey - py) * ((i + 1) / 6)); ctx.stroke();
      }
    }
    ctx.fillStyle = "#2B323A"; ctx.beginPath(); ctx.arc(px, py, 5, 0, 7); ctx.fill();
    ctx.fillStyle = open ? "#3BD16F" : "#FF4A3D"; ctx.beginPath(); ctx.arc(px, py, 2.6, 0, 7); ctx.fill();
  }

  function drawGates(t) {
    const { gy0, gatesH, slotW, slotH, gates, gc } = lay;
    ctx.fillStyle = "#3E4853"; ctx.fillRect(0, gy0, W, gatesH);
    ctx.fillStyle = "#353E48"; ctx.fillRect(0, gy0 + gatesH - 3, W, 3);
    const flash = t - gateFlash < 0.6 ? 1 - (t - gateFlash) / 0.6 : 0;
    gates.forEach((g, i) => {
      const x = g.x - slotW / 2 + 3, y = gy0 + 8, w = slotW - 6;
      const locked = i >= S.gateCount;
      ctx.fillStyle = locked ? "#343C45" : flash ? `rgba(227,64,58,${0.35 * flash + 0.08})` : "rgba(255,255,255,.05)";
      rrect(x, y, w, slotH, 6); ctx.fill();
      ctx.setLineDash(locked ? [4, 4] : []);
      ctx.strokeStyle = locked ? "rgba(255,255,255,.25)" : "#F2C230"; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
      ctx.font = `700 12px "Barlow Condensed", sans-serif`; ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillStyle = locked ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.6)"; ctx.fillText("A" + (i + 1), x + 5, y + 4);
      if (locked) {
        ctx.font = `800 22px "Barlow Condensed", sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(255,255,255,.3)"; ctx.fillText("+", g.x, g.y);
      }
      const id = S.gates[i];
      if (id === null) return;
      const p = S.planes[id], v = vis.get(id);
      if (p.where === "taxi") return;
      const pu = pulse[i] ? Math.max(0, 1 - (t - pulse[i]) / 0.16) : 0;
      const isFull = v && v.kind === "full" && t - v.t0 > FLY;
      const dst = A.DEST[p.dest];
      // Füllstand als Balken am Rand des Gates
      const seats = A.SEATS[p.len], landed = Math.max(0, seats - p.seatsLeft - flyers.filter(f => f.gate === i).length);
      const bh = slotH - 24, bx = x + w - 8, bt = y + 18;
      ctx.fillStyle = "rgba(0,0,0,.35)"; rrect(bx, bt, 4, bh, 2); ctx.fill();
      const fh = (bh * landed) / seats;
      if (fh > 0) { ctx.fillStyle = dst.color; rrect(bx, bt + bh - fh, 4, fh, 2); ctx.fill(); }
      if (pu || isFull) { ctx.fillStyle = `rgba(255,255,255,${isFull ? 0.12 : 0.1 * pu})`; rrect(x, y, w, slotH, 6); ctx.fill(); }
      drawPlane(g.x, g.y, -Math.PI / 2, gc * (1 + 0.1 * pu), p);
      // Zähler der fehlenden Plätze, hüpft bei jedem Einsteigen
      const txt = isFull ? "VOLL!" : String(seats - landed);
      const fs = 14 * (1 + 0.35 * pu) * (isFull ? 1.1 : 1);
      ctx.font = `800 ${fs.toFixed(1)}px "Barlow Condensed", sans-serif`;
      const tw = Math.max(26, ctx.measureText(txt).width + 12);
      const py = gy0 + gatesH - 21 - 3 * pu;
      ctx.fillStyle = isFull ? "#FFC83A" : dst.color; rrect(g.x - tw / 2, py, tw, 17, 8.5); ctx.fill();
      if (dst.id === "JP" && !isFull) { ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.fillStyle = isFull ? "#15181C" : dst.text; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, g.x, py + 9);
    });
  }

  function drawApron(t) {
    const { ax, ay, cell: c } = lay;
    // Stellflächen
    for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) {
      if (!S.mask[y][x]) continue;
      ctx.fillStyle = (x + y) % 2 ? "#56626E" : "#5A6672";
      ctx.fillRect(ax + x * c, ay + y * c, c, c);
    }
    ctx.strokeStyle = "rgba(242,194,48,.18)"; ctx.lineWidth = 1;
    for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) {
      if (S.mask[y][x]) ctx.strokeRect(ax + x * c + 0.5, ay + y * c + 0.5, c - 1, c - 1);
    }
    // Hangar mit Rollbahn
    for (const h of S.hangars) {
      const [dx, dy] = A.DIRS[h.dir];
      const hx = ax + (h.x + 0.5) * c, hy = ay + (h.y + 0.5) * c;
      let ex = h.x, ey = h.y;
      while (ex + dx >= 0 && ey + dy >= 0 && ex + dx < S.cols && ey + dy < S.rows) { ex += dx; ey += dy; }
      ctx.setLineDash([c * 0.18, c * 0.14]); ctx.strokeStyle = "rgba(242,194,48,.75)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ax + (ex + 0.5 + dx * 0.5) * c, ay + (ey + 0.5 + dy * 0.5) * c); ctx.stroke(); ctx.setLineDash([]);
      ctx.save(); ctx.translate(hx, hy); ctx.rotate(ANG[h.dir] + Math.PI / 2);
      ctx.fillStyle = "#2E353D"; rrect(-c * 0.44 + 2, -c * 0.44 + 3, c * 0.88, c * 0.88, 6); ctx.fill();
      ctx.fillStyle = "#C9D0D7"; rrect(-c * 0.44, -c * 0.44, c * 0.88, c * 0.88, 6); ctx.fill();
      ctx.fillStyle = "#A4AEB8"; for (let i = 1; i < 4; i++) ctx.fillRect(-c * 0.44 + 4, -c * 0.44 + i * c * 0.2, c * 0.88 - 8, 2);
      ctx.fillStyle = "#2B323A"; ctx.fillRect(-c * 0.3, -c * 0.46, c * 0.6, c * 0.16);
      ctx.restore();
      if (h.queue.length) {
        const r = Math.max(9, c * 0.2);
        ctx.fillStyle = "#15181C"; ctx.beginPath(); ctx.arc(hx + c * 0.3, hy + c * 0.3, r, 0, 7); ctx.fill();
        ctx.fillStyle = "#FFC83A"; ctx.font = `800 ${Math.round(r * 1.3)}px "Barlow Condensed", sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(h.queue.length, hx + c * 0.3, hy + c * 0.3 + 1);
      }
    }
    // Flugzeuge auf dem Vorfeld
    for (const p of S.planes) {
      if (p.where !== "apron") continue;
      const v = vis.get(p.id), [dx, dy] = A.DIRS[p.dir];
      let { x, y } = planeCenter(p), alpha = 1;
      if (v && v.kind === "bump") { const s = Math.min(1, (t - v.t0) / 0.32), o = Math.sin(s * Math.PI) * v.dist; x += dx * o; y += dy * o; }
      if (v && v.kind === "spawn") { const s = Math.min(1, (t - v.t0) / 0.4), o = (1 - s) * c * 1.4; x -= dx * o; y -= dy * o; alpha = s; }
      drawPlane(x, y, ANG[p.dir], c, p, alpha);
    }
  }

  // ---------- Hinweise und Karten ----------
  let toastTimer = 0, hintTimer = 0;
  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 1100);
  }
  function showHint(html, stage = "1") {
    const el = $("#hint"); el.innerHTML = html; el.dataset.stage = stage; el.hidden = false;
    clearTimeout(hintTimer); hintTimer = setTimeout(hideHint, 6500);
  }
  function hideHint() { $("#hint").hidden = true; }
  function showCard(html) { $("#card").innerHTML = html; $("#overlay").hidden = false; }

  $("#lvlBtn").addEventListener("click", () => {
    const btns = A.LEVELS.map((L, i) => `<button data-l="${i}" ${i > maxLevel ? "disabled" : ""} class="${i === levelIdx ? "cur" : ""}" aria-label="Level ${i + 1}: ${L.name}">${i + 1}</button>`).join("");
    showCard(`
      <div class="eyebrow">Abflugtafel</div>
      <h2>Level wählen</h2>
      <div class="levels">${btns}</div>
      <div class="actions"><button class="btn alt" id="closeBtn">Zurück zum Spiel</button></div>`);
    $("#card").querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => startLevel(+b.dataset.l)));
    $("#closeBtn").addEventListener("click", () => ($("#overlay").hidden = true));
  });
  $("#restartBtn").addEventListener("click", () => startLevel(levelIdx));
  $("#gateBtn").addEventListener("click", () => { audioInit(); openExtraGate(); });
  function syncMute() { $("#muteWave").style.opacity = muted ? 0 : 1; $("#muteBtn").setAttribute("aria-label", muted ? "Ton an" : "Ton aus"); }
  $("#muteBtn").addEventListener("click", () => { muted = !muted; store.set("abflug.muted", muted); syncMute(); audioInit(); });

  // ---------- Ton ----------
  let ac = null;
  function audioInit() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (ac.state === "suspended") ac.resume();
  }
  function tone(freq, dur, type = "sine", vol = 0.12, slide = 1, delay = 0) {
    if (muted || !ac) return;
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(freq * slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    go: () => tone(420, 0.14, "triangle", 0.12, 1.8),
    bump: () => tone(130, 0.16, "square", 0.06, 0.6),
    // Tonleiter steigt mit dem Füllstand: je voller, desto höher.
    board(fill) {
      const steps = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
      const f = 392 * 2 ** (steps[Math.min(steps.length - 1, Math.floor(fill * steps.length))] / 12);
      tone(f, 0.11, "sine", 0.09, 1.04);
      tone(f * 2, 0.05, "triangle", 0.03);
    },
    full() {
      [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, 0.6, "sine", 0.07, 1, i * 0.05));
      tone(2637, 0.8, "triangle", 0.035, 1, 0.22);
    },
    whoosh() {
      if (muted || !ac) return;
      const len = 0.9, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t0 = ac.currentTime;
      src.buffer = buf; f.type = "bandpass"; f.Q.value = 1.2;
      f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(2400, t0 + len);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
      src.connect(f).connect(g).connect(ac.destination); src.start(t0);
    },
    win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.28, "triangle", 0.1, 1, i * 0.11)),
    lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.3, "triangle", 0.09, 1, i * 0.14)),
  };

  // ---------- Start ----------
  function frame() {
    const t = now(), dt = Math.min(0.05, t - last || 0);
    last = t;
    update(t, dt);
    draw(t);
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize", layout);
  syncMute();
  window.claude?.hot?.snapshot?.(() => ({ levelIdx }));
  const boot = data => {
    startLevel(data?.levelIdx ?? store.get("abflug.level", 0));
    last = now();
    requestAnimationFrame(frame);
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
