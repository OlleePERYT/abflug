<title>Abflug!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: Insel-Flughafen. Oben Terminal mit Wartering, Mitte Gates, unten Vorfeld, rundherum Meer. */
:root {
  --sea: #1FA9C6;
  --teal: #0E5E6F;
  --teal-dark: #08414D;
  --sun: #FFE066;
  --coral: #FF6F61;
  --coral-dark: #C9483D;
  --ink: #16323A;
  --muted: #4E6A72;
  --card: #FFFDF7;
  --font-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--font-body); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#app { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; display: block; }
#safe { position: absolute; width: 0; height: 0; padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: calc(8px + env(safe-area-inset-top, 0px)) 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.board { display: flex; align-items: baseline; gap: 8px; min-width: 0; background: var(--teal); color: var(--sun); border: 0; border-radius: 14px; padding: 1px 13px 2px; font-family: var(--font-display); box-shadow: 0 3px 0 var(--teal-dark); cursor: pointer; }
.board-k { font-weight: 800; font-size: 21px; }
.board-v { font-weight: 700; font-size: 15px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-right { display: flex; gap: 6px; }
.chip, .icon { height: 36px; border: 0; border-radius: 12px; background: var(--teal); color: #FFFFFF; font-family: var(--font-display); font-weight: 800; font-size: 16px; box-shadow: 0 3px 0 var(--teal-dark); cursor: pointer; display: grid; place-items: center; }
.chip { padding: 0 11px; color: var(--sun); white-space: nowrap; }
.chip:disabled { opacity: .4; cursor: default; }
.icon { width: 36px; }
.icon svg { width: 18px; height: 18px; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.toast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); background: var(--coral); color: #FFFFFF; font-family: var(--font-display); font-weight: 800; font-size: 21px; padding: 6px 20px; border-radius: 999px; box-shadow: 0 4px 0 var(--coral-dark); pointer-events: none; white-space: nowrap; }
.hint { position: absolute; left: 50%; top: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(92vw, 400px); background: rgba(255,253,247,.97); color: var(--ink); border: 3px solid #FFFFFF; border-radius: 18px; padding: 10px 16px; font-size: 15px; font-weight: 700; line-height: 1.4; text-align: center; pointer-events: none; box-shadow: 0 8px 24px rgba(8,65,77,.28); }
.hint b { color: var(--coral); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,65,77,.45); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { width: 100%; max-width: 340px; background: var(--card); color: var(--ink); border: 4px solid #FFFFFF; border-radius: 26px; padding: 22px 20px 20px; text-align: center; box-shadow: 0 14px 40px rgba(8,65,77,.35); }
.card .eyebrow { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--muted); }
.card h2 { font-family: var(--font-display); font-weight: 800; font-size: 36px; line-height: 1.05; color: var(--teal); margin: 4px 0 10px; text-wrap: balance; }
.card p { margin: 0 0 16px; font-size: 15px; line-height: 1.45; color: #34525A; }
.actions { display: grid; gap: 10px; }
.btn { height: 48px; border: 0; border-radius: 16px; font-family: var(--font-display); font-weight: 800; font-size: 20px; cursor: pointer; background: var(--coral); color: #FFFFFF; box-shadow: 0 4px 0 var(--coral-dark); }
.btn.alt { background: #E6F5F2; color: var(--teal); box-shadow: 0 4px 0 #C4DED9; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
.levels button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 14px; background: var(--teal); color: var(--sun); font-family: var(--font-display); font-weight: 800; font-size: 22px; box-shadow: 0 3px 0 var(--teal-dark); cursor: pointer; }
.levels button:disabled { background: #E1E9E8; color: #9FB2B5; box-shadow: none; cursor: default; }
.levels button.cur { outline: 3px solid var(--coral); outline-offset: 2px; }
.levels { max-height: 44vh; overflow-y: auto; padding: 5px; }
.chip svg { width: 22px; height: 16px; margin-right: 4px; }
.chip.tow { display: flex; align-items: center; }
.chip.armed { background: var(--coral); color: #FFFFFF; box-shadow: 0 3px 0 var(--coral-dark); }
.streak { display: flex; justify-content: center; gap: 6px; margin: 0 0 6px; }
.streak i { width: 34px; height: 10px; border-radius: 5px; background: #E1E9E8; }
.streak i.on { background: var(--coral); }
.card p.small { font-size: 14px; margin-bottom: 14px; }
.meter { height: 12px; border-radius: 6px; background: #E1E9E8; margin: -6px 0 16px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--coral); border-radius: 6px; }
.newstamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0 0 14px; }
.newstamps span { display: flex; align-items: center; gap: 6px; background: #FFF1C2; border-radius: 10px; padding: 3px 9px 3px 4px; font-size: 13px; font-weight: 800; }
.newstamps img, .stamp img, .stamp .q { width: 30px; height: 20px; border-radius: 3px; flex: none; }
.pass { display: grid; gap: 7px; max-height: 50vh; overflow-y: auto; margin-bottom: 16px; text-align: left; }
.stamp { display: flex; gap: 10px; align-items: center; background: #F3EFE3; border-radius: 12px; padding: 7px 10px; }
.stamp > div { flex: 1; min-width: 0; }
.stamp b { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 15px; }
.stamp .stars { color: var(--coral); letter-spacing: 1px; }
.stamp small { display: block; font-size: 12px; color: var(--muted); }
.stamp .bar { height: 5px; background: #E1E9E8; border-radius: 3px; margin-top: 3px; overflow: hidden; }
.stamp .bar span { display: block; height: 100%; background: var(--coral); }
.stamp.locked { opacity: .55; }
.btn:disabled { opacity: .5; cursor: default; }
.isle { display: block; width: 100%; aspect-ratio: 320 / 230; border-radius: 18px; margin: 0 0 12px; }
.stamp .q { display: grid; place-items: center; background: #C9D6D8; color: #FFFFFF; font-weight: 800; }
</style>

<div id="app">
  <canvas id="cv" aria-label="Spielfeld: Terminal, Gates und Vorfeld"></canvas>
  <div id="safe"></div>
  <header class="hud">
    <button id="lvlBtn" class="board" aria-label="Level wählen"><span id="lvlNum" class="board-k">1</span><span id="lvlTxt" class="board-v">Erster Flug</span></button>
    <div class="hud-right">
      <button id="towBtn" class="chip tow" aria-label="Schlepper benutzen" hidden><svg viewBox="0 0 22 16" fill="currentColor"><rect x="1" y="5" width="13" height="6" rx="2"/><rect x="8" y="1" width="6" height="5" rx="1.5"/><path d="M14 8h6v2h-6z"/><circle cx="4.5" cy="12.5" r="2.5"/><circle cx="11.5" cy="12.5" r="2.5"/></svg><span id="towN">1</span></button>
      <button id="passBtn" class="icon" aria-label="Reisepass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10.5" r="3"/><path d="M9 17h6"/></svg></button>
      <button id="restartBtn" class="icon" aria-label="Level neu starten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
      <button id="muteBtn" class="icon" aria-label="Ton aus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
    </div>
  </header>
  <div id="toast" class="toast" hidden></div>
  <div id="hint" class="hint" hidden></div>
  <div id="overlay" class="overlay" hidden><div class="card" id="card"></div></div>
</div>

<script id="logic">
// Spiellogik ohne DOM. Wird auch von den Tests geladen.
window.Abflug = (() => {
  const SEATS = { 2: 16, 3: 24, 4: 40 };
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const DKEYS = ["U", "D", "L", "R"];
  const DEST = [
    { id: "ES", name: "Spanien", color: "#F6C028", text: "#2A2205" },
    { id: "IT", name: "Italien", color: "#24A157", text: "#FFFFFF" },
    { id: "GR", name: "Griechenland", color: "#3DB6E8", text: "#06283A" },
    { id: "TR", name: "Türkei", color: "#E3403A", text: "#FFFFFF" },
    { id: "JP", name: "Japan", color: "#F5F3EC", text: "#B0162A" },
    { id: "SE", name: "Schweden", color: "#2453B8", text: "#FFFFFF" },
    { id: "NL", name: "Niederlande", color: "#F28A1E", text: "#2A1604" },
    { id: "MX", name: "Mexiko", color: "#EC5FA8", text: "#FFFFFF" },
    { id: "FR", name: "Frankreich", color: "#8E5BD0", text: "#FFFFFF" },
    { id: "QA", name: "Katar", color: "#14A89C", text: "#FFFFFF" },
    { id: "EG", name: "Ägypten", color: "#454A55", text: "#FFFFFF" },
  ];

  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const grid = (c, r, f) => Array.from({ length: r }, (_, y) => Array.from({ length: c }, (_, x) => !!f(x, y)));
  const art = rows => rows.map(s => [...s].map(ch => ch === "#"));

  // Wartering im Terminal: RING Reihen à 4 Plätze, Position 0 ist der Ausgang zu den Gates.
  const RING = 20, ENTRY = { L: 7, R: 13 };

  const LEVELS = [
    // Tutorial: festes Level. Flugzeug 0 ist frei, 1 wird von 2 blockiert.
    { name: "Erster Flug", tutorial: true, dests: 3, planes: 8, mode: "seq", fixed: {
      cols: 5, rows: 6,
      planes: [
        [1, 1, "U", 2, 1], [2, 3, "R", 3, 0], [3, 4, "D", 2, 3], [0, 5, "L", 2, 0],
        [4, 0, "U", 3, 3], [3, 1, "R", 2, 1], [2, 5, "D", 2, 0], [0, 1, "U", 2, 3],
      ],
      L: [[1, 16], [3, 16], [0, 24], [3, 24]],
      R: [[1, 16], [0, 16], [3, 16], [0, 16]],
      sol: [0, 2, 1, 4, 5, 3, 7, 6],
    } },
    { name: "Inselhüpfer", mask: grid(7, 9, () => 1), dests: 5, planes: 18, mode: "seq" },
    { name: "Kokosbucht", mask: grid(8, 10, (x, y) => !((x === 0 || x === 7) && (y === 0 || y === 9))), dests: 6, planes: 24, mode: "seq" },
    { name: "Schranken", mask: grid(8, 11, () => 1), dests: 6, planes: 28, mode: "alt" },
    { name: "Jumbo", mask: art([
      "....##....",
      "...####...",
      "...####...",
      "..######..",
      "##########",
      "##########",
      ".########.",
      "...####...",
      "...####...",
      "...####...",
      "..######..",
      "..######..",
    ]), dests: 7, planes: 28, mode: "alt" },
    { name: "Tropennebel", mask: grid(11, 11, (x, y) => Math.abs(x - 5) + Math.abs(y - 5) <= 6), dests: 7, planes: 30, mode: "alt", mystery: 0.25 },
    { name: "Hangar", mask: grid(9, 12, () => 1), dests: 8, planes: 38, mode: "alt", hangars: 1, hangarSize: 4 },
    { name: "Koffer", mask: art([
      "...####...",
      "...#..#...",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
    ]), dests: 8, planes: 40, mode: "alt", mystery: 0.25, hangars: 1, hangarSize: 4 },
    { name: "Weltreise", mask: grid(11, 12, (x, y) => ((x - 5) / 5.6) ** 2 + ((y - 5.5) / 6.1) ** 2 <= 1), dests: 9, planes: 36, mode: "alt", mystery: 0.3 },
    { name: "Tower", mask: art([
      "..######..",
      ".########.",
      "##########",
      "##########",
      ".########.",
      "...####...",
      "...####...",
      "...####...",
      "..######..",
      ".########.",
      "##########",
      "##########",
      "##########",
    ]), dests: 10, planes: 42, mode: "alt", mystery: 0.3, hangars: 2, hangarSize: 4 },
  ];

  // Nach den festen Levels geht es endlos weiter: Form, Ziele und Größe kommen aus dem Level-Index.
  const SHAPES = [
    (c, r) => grid(c, r, () => 1),
    (c, r) => grid(c, r, (x, y) => Math.abs(x - (c - 1) / 2) / (c / 2) + Math.abs(y - (r - 1) / 2) / (r / 2) <= 1.2),
    (c, r) => grid(c, r, (x, y) => ((x - (c - 1) / 2) / (c / 2 + 0.3)) ** 2 + ((y - (r - 1) / 2) / (r / 2 + 0.3)) ** 2 <= 1),
    (c, r) => grid(c, r, (x, y) => !((x < c * 0.25 || x >= c * 0.75) && (y < r * 0.2 || y >= r * 0.8))),
    (c, r) => grid(c, r, (x, y) => x < c * 0.4 || x >= c * 0.6 || (y >= r * 0.3 && y < r * 0.7)),
  ];
  const ISLES = ["Muschelriff", "Mangohain", "Flamingo", "Passatwind", "Lagune", "Riffkante", "Sonnendeck", "Hängematte", "Ananas", "Seestern", "Korallen", "Leuchtturm", "Papagei", "Schildkröte", "Brandung"];
  const defs = {};
  function levelDef(li) {
    if (li < LEVELS.length) return LEVELS[li];
    if (defs[li]) return defs[li];
    const k = li - LEVELS.length, r = rng(li * 31337 + 7), round = Math.floor(k / ISLES.length);
    const c = 9 + ((r() * 3) | 0), rows = 11 + ((r() * 3) | 0), h = r() < 0.5 ? 1 + (r() < 0.3 ? 1 : 0) : 0;
    return (defs[li] = {
      name: ISLES[k % ISLES.length] + (round ? " " + (round + 1) : ""),
      mask: SHAPES[(r() * SHAPES.length) | 0](c, rows),
      dests: Math.min(DEST.length, 9 + (k >> 2)), planes: 32 + Math.min(8, k >> 1), mode: "alt",
      mystery: Math.min(0.4, 0.25 + k * 0.01), hangars: h, hangarSize: 4, accept: 0.8,
    });
  }

  // Flugzeug: (x, y) ist die Nase, der Rumpf liegt entgegen der Richtung.
  function cellsOf(p) {
    const [dx, dy] = DIRS[p.dir], out = [];
    for (let k = 0; k < p.len; k++) out.push([p.x - k * dx, p.y - k * dy]);
    return out;
  }
  function pathOf(p, cols, rows) {
    const [dx, dy] = DIRS[p.dir], out = [];
    let x = p.x + dx, y = p.y + dy;
    while (x >= 0 && y >= 0 && x < cols && y < rows) { out.push([x, y]); x += dx; y += dy; }
    return out;
  }

  // Rückwärts bauen: Jedes neue Flugzeug braucht freie Bahn an allen bisherigen vorbei.
  // Damit ist die umgekehrte Reihenfolge immer eine gültige Lösung fürs Vorfeld.
  function tryGen(L, r, dig) {
    const rows = L.mask.length, cols = L.mask[0].length;
    const occ = Array.from({ length: rows }, () => Array(cols).fill(null));
    const inMask = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows && L.mask[y][x];
    const hangars = [];
    for (let h = 0; h < (L.hangars || 0); h++) {
      for (let t = 0; t < 400; t++) {
        const x = (r() * cols) | 0, y = (r() * rows) | 0, dir = DKEYS[(r() * 4) | 0];
        const [dx, dy] = DIRS[dir];
        if (!inMask(x, y) || !inMask(x + dx, y + dy) || !inMask(x + 2 * dx, y + 2 * dy)) continue;
        const ray = [];
        let cx = x, cy = y, ok = true;
        while (cx >= 0 && cy >= 0 && cx < cols && cy < rows) {
          if (occ[cy][cx] !== null) { ok = false; break; }
          ray.push([cx, cy]); cx += dx; cy += dy;
        }
        if (!ok || ray.length < 4) continue;
        occ[y][x] = "H";
        ray.slice(1).forEach(([a, b]) => (occ[b][a] = "R"));
        hangars.push({ x, y, dir });
        break;
      }
    }
    const hangarPlanes = hangars.length * (L.hangarSize || 0);
    const target = L.planes - hangarPlanes;
    const lens = [2, 2, 2, 2, 3, 3, 3, 4, 4];
    const base = [];
    for (let t = 0; t < 14000 && base.length < target; t++) {
      const p = { x: (r() * cols) | 0, y: (r() * rows) | 0, dir: DKEYS[(r() * 4) | 0], len: lens[(r() * lens.length) | 0] };
      const cells = cellsOf(p);
      if (!cells.every(([a, b]) => inMask(a, b) && occ[b][a] === null)) continue;
      if (pathOf(p, cols, rows).some(([a, b]) => occ[b][a] === "H" || typeof occ[b][a] === "number")) continue;
      const i = base.length;
      base.push(p);
      cells.forEach(([a, b]) => (occ[b][a] = i));
    }
    if (base.length < 3) return null;

    const planes = base.map((p, i) => ({ id: i, ...p, hangar: -1, mystery: false }));
    hangars.forEach((h, hi) => {
      const [dx, dy] = DIRS[h.dir];
      h.queue = [];
      for (let k = 0; k < L.hangarSize; k++) {
        const p = { id: planes.length, x: h.x + 2 * dx, y: h.y + 2 * dy, dir: h.dir, len: 2, hangar: hi, mystery: false };
        planes.push(p); h.queue.push(p.id);
      }
    });
    // Ziele verteilen: Ein oder zwei "versteckte" Ziele bekommen nur Flugzeuge, die anfangs
    // zugeparkt sind. So muss man genau die zuerst gefragten Länder erst freispielen.
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const st0 = createState({ cols, rows, mask: L.mask, mode: L.mode, planes: planes.map(p => ({ ...p, dest: 0 })), hangars, arms: { L: [], R: [] } });
    const freeIds = new Set(st0.planes.filter(p => p.where === "apron" && freeRun(st0, p) < 0).map(p => p.id));
    const perm = shuffle([...Array(L.dests).keys()]);
    const hidden = perm.slice(0, L.dests >= 5 ? 2 : 1), open = perm.slice(hidden.length);
    const per = Math.max(1, Math.round(planes.length / L.dests));
    const blocked = shuffle(planes.filter(p => p.hangar < 0 && !freeIds.has(p.id)).map(p => p.id));
    const used = new Set();
    hidden.forEach(d => { for (let k = 0; k < per && blocked.length; k++) { const id = blocked.pop(); planes[id].dest = d; used.add(id); } });
    const rest = shuffle(planes.filter(p => !used.has(p.id)).map(p => p.id));
    rest.forEach((id, k) => (planes[id].dest = k < open.length ? open[k] : open[(r() * open.length) | 0]));
    if (L.mystery) base.forEach((_, i) => (planes[i].mystery = r() < L.mystery));

    const built = buildQueue({ cols, rows, mask: L.mask, mode: L.mode, planes, hangars }, r, dig.p, dig.maxB);
    if (!built) return null;
    const { sol, seq } = built;
    const arms = { L: [], R: [] };
    if (L.mode === "seq") {
      const total = seq.reduce((s, g) => s + g.n, 0);
      let acc = 0;
      seq.forEach(g => { (acc < total / 2 ? arms.L : arms.R).push(g); acc += g.n; });
    } else {
      seq.forEach((g, k) => (k % 2 ? arms.R : arms.L).push(g));
    }
    return {
      name: L.name, cols, rows, mask: L.mask, mode: L.mode, planes,
      hangars: hangars.map(h => ({ x: h.x, y: h.y, dir: h.dir, queue: h.queue })),
      arms, sol, tourists: seq.reduce((s, g) => s + g.n, 0),
    };
  }

  // Alle Flugzeuge, die weg müssen, bevor p frei ist. null, wenn ein Hangar-Flugzeug im Weg steht.
  function blockersOf(st, p) {
    const need = new Set(), stack = [p.id], m = occMap(st);
    while (stack.length) {
      const q = st.planes[stack.pop()];
      for (const [x, y] of pathOf(q, st.cols, st.rows)) {
        const o = m.get(x + "," + y);
        if (o === undefined) continue;
        if (o < 0 || st.planes[o].hangar >= 0) return null;
        if (!need.has(o)) { need.add(o); stack.push(o); }
      }
    }
    return need;
  }

  // Schlange bauen, indem ein Spiel mit vier Gates simuliert wird. Mit Wahrscheinlichkeit dig
  // kommen zuerst Touristen für ein zugeparktes Flugzeug: Man muss es freispielen und die
  // Blocker so lange an den Gates parken. Die Reihenfolge der Abflüge ist die Lösung.
  function buildQueue(base, r, dig, maxB) {
    const st = createState({ ...base, arms: { L: [], R: [] } });
    const need = {}, sol = [], seq = [];
    st.planes.forEach(p => (need[p.id] = SEATS[p.len]));
    const freeGates = () => st.gates.slice(0, st.gateCount).filter(g => g === null).length;
    const send = id => { if (!tap(st, id).ok) throw new Error("send"); arrive(st, id); sol.push(id); };
    const emit = (id, n) => {
      const p = st.planes[id];
      n = Math.min(n, need[id]); need[id] -= n;
      const last = seq[seq.length - 1];
      if (last && last.dest === p.dest) last.n += n; else seq.push({ dest: p.dest, n });
      if (!need[id]) depart(st, id);
    };
    let first = true;
    for (let guard = 0; guard < 20000; guard++) {
      if (st.planes.every(p => p.where === "gone")) return { sol, seq };
      const fg = freeGates();
      const onApron = st.planes.filter(p => p.where === "apron");
      if (fg >= 2 && onApron.length && (first || r() < dig)) {
        const cands = [];
        // Nur Ziele, für die gerade kein Flugzeug frei steht oder am Gate wartet.
        const easy = new Set(st.planes.filter(q => (q.where === "apron" && freeRun(st, q) < 0) || (q.where === "gate" && need[q.id] > 0)).map(q => q.dest));
        for (const p of onApron) {
          if (easy.has(p.dest)) continue;
          const b = blockersOf(st, p);
          if (b && b.size <= maxB && b.size + 1 <= fg) cands.push([p, b]);
        }
        if (cands.length) {
          const most = Math.max(...cands.map(c => c[1].size));
          const top = cands.filter(c => c[1].size === most);
          const [p, b] = top[(r() * top.length) | 0];
          const todo = new Set(b);
          for (let g2 = 0; todo.size && g2 < 50; g2++) {
            for (const id of [...todo]) if (freeRun(st, st.planes[id]) < 0) { send(id); todo.delete(id); }
          }
          if (todo.size) return null;
          send(p.id);
          emit(p.id, r() < 0.5 ? need[p.id] : 8);
          first = false;
          continue;
        }
      }
      const atGate = st.planes.filter(p => p.where === "gate" && need[p.id] > 0);
      const free = onApron.filter(p => freeRun(st, p) < 0);
      if (fg > 0 && free.length && (!atGate.length || r() < 0.3)) { send(free[(r() * free.length) | 0].id); continue; }
      if (atGate.length) { emit(atGate[(r() * atGate.length) | 0].id, r() < 0.55 ? 8 : 16); first = false; continue; }
      return null;
    }
    return null;
  }

  function createState(lv) {
    const planes = lv.planes.map(p => ({ ...p, where: p.hangar >= 0 ? "hangar" : "apron", seatsLeft: SEATS[p.len], gate: -1, revealed: !p.mystery }));
    const hangars = lv.hangars.map(h => ({ x: h.x, y: h.y, dir: h.dir, queue: [...h.queue] }));
    hangars.forEach(h => { planes[h.queue.shift()].where = "apron"; });
    const st = {
      cols: lv.cols, rows: lv.rows, mask: lv.mask, mode: lv.mode, planes, hangars,
      gates: [null, null, null, null, null], gateCount: 4,
      arms: { L: { groups: lv.arms.L.map(g => ({ ...g })), taken: 0 }, R: { groups: lv.arms.R.map(g => ({ ...g })), taken: 0 } },
      active: "L", boarded: 0,
      ring: new Array(RING * 4).fill(-1), off: 0,
    };
    if (!st.arms.L.groups.length) st.active = "R";
    reveal(st);
    return st;
  }
  function occMap(st) {
    const m = new Map();
    st.planes.forEach(p => { if (p.where === "apron") cellsOf(p).forEach(([x, y]) => m.set(x + "," + y, p.id)); });
    st.hangars.forEach(h => m.set(h.x + "," + h.y, -1));
    return m;
  }
  // -1: Weg frei. Sonst Anzahl freier Felder bis zum Hindernis.
  function freeRun(st, p, m = occMap(st)) {
    const path = pathOf(p, st.cols, st.rows);
    for (let k = 0; k < path.length; k++) if (m.has(path[k][0] + "," + path[k][1])) return k;
    return -1;
  }
  function reveal(st) {
    const m = occMap(st);
    st.planes.forEach(p => { if (p.where === "apron" && !p.revealed && freeRun(st, p, m) < 0) p.revealed = true; });
  }
  // tow: Der Schlepper zieht das Flugzeug heraus, auch wenn der Weg zugeparkt ist.
  function tap(st, id, tow = false) {
    const p = st.planes[id];
    if (!p || p.where !== "apron") return { ok: false, reason: "none" };
    const k = freeRun(st, p);
    if (k >= 0 && !tow) return { ok: false, reason: "blocked", free: k };
    let g = -1;
    for (let i = 0; i < st.gateCount; i++) if (st.gates[i] === null) { g = i; break; }
    if (g < 0) return { ok: false, reason: "gates" };
    p.where = "taxi"; p.gate = g; p.revealed = true; st.gates[g] = id;
    let spawned = null;
    if (p.hangar >= 0) {
      const h = st.hangars[p.hangar];
      if (h.queue.length) { spawned = h.queue.shift(); st.planes[spawned].where = "apron"; }
    }
    reveal(st);
    return { ok: true, gate: g, spawned };
  }
  function arrive(st, id) { const p = st.planes[id]; if (p.where === "taxi") p.where = "gate"; }
  function frontArm(st) {
    let a = st.arms[st.active];
    if (!a.groups.length) {
      const o = st.active === "L" ? "R" : "L";
      if (st.arms[o].groups.length) { st.active = o; a = st.arms[o]; }
    }
    return a.groups.length ? a : null;
  }
  function rowAt(st, pos) { return (((pos - st.off) % RING) + RING) % RING; }
  function gatePlaneFor(st, dest) {
    for (let i = 0; i < st.gateCount; i++) {
      const id = st.gates[i];
      if (id === null) continue;
      const p = st.planes[id];
      if (p.where === "gate" && p.dest === dest && p.seatsLeft > 0) return p;
    }
    return null;
  }
  // Ein Schritt: Der Ring rückt eine Reihe weiter. Am Ausgang steigt ein, wer ein passendes
  // Flugzeug am Gate hat. Am offenen Zulauf rücken Touristen in freie Plätze nach.
  function tick(st) {
    st.off = (st.off + 1) % RING;
    const boards = [];
    const j0 = rowAt(st, 0);
    for (let c = 0; c < 4; c++) {
      const k = j0 * 4 + c, d = st.ring[k];
      if (d < 0) continue;
      const p = gatePlaneFor(st, d);
      if (!p) continue;
      st.ring[k] = -1; p.seatsLeft--; st.boarded++;
      if (!p.seatsLeft) p.where = "full";
      boards.push({ plane: p.id, dest: d, lane: c, full: !p.seatsLeft });
    }
    let entered = null;
    const a = frontArm(st);
    if (a) {
      const side = st.active, j = rowAt(st, ENTRY[side]), before = a.taken;
      for (let c = 0; c < 4 && a.groups.length; c++) {
        const k = j * 4 + c;
        if (st.ring[k] >= 0) continue;
        const grp = a.groups[0];
        st.ring[k] = grp.dest; grp.n--; a.taken++;
        if (!grp.n) {
          a.groups.shift();
          const o = side === "L" ? "R" : "L";
          if ((st.mode === "alt" && st.arms[o].groups.length) || !a.groups.length) { st.active = o; break; }
        }
      }
      if (a.taken > before) entered = { side, before, after: a.taken };
    }
    return { boards, entered };
  }
  function depart(st, id) { const p = st.planes[id]; st.gates[p.gate] = null; p.where = "gone"; }
  function status(st) {
    const queued = st.arms.L.groups.length + st.arms.R.groups.length;
    if (!queued && st.ring.every(d => d < 0) && st.planes.every(p => p.where === "gone")) return "win";
    if (st.planes.some(p => p.where === "taxi" || p.where === "full")) return "busy";
    const gd = new Set();
    for (let i = 0; i < st.gateCount; i++) if (st.gates[i] !== null) gd.add(st.planes[st.gates[i]].dest);
    if (st.ring.some(d => d >= 0 && gd.has(d))) return "boarding";
    for (let i = 0; i < st.gateCount; i++) if (st.gates[i] === null) return "play";
    if (queued && st.ring.some(d => d < 0)) return "filling";
    return "lose";
  }

  // Spielt die Lösungsreihenfolge stur durch: so früh wie möglich losrollen, sonst Ring laufen lassen.
  function solve(lv) {
    const st = createState(lv);
    let idx = 0;
    for (let n = 0; n < 400000; n++) {
      st.planes.forEach(p => { if (p.where === "full") depart(st, p.id); });
      const s = status(st);
      if (s === "win") return true;
      if (s === "lose") return false;
      if (idx < lv.sol.length) {
        const r = tap(st, lv.sol[idx]);
        if (r.ok) { arrive(st, lv.sol[idx]); idx++; continue; }
        if (r.reason !== "gates") return false;
      }
      tick(st);
    }
    return false;
  }

  function fixedLevel(L) {
    const F = L.fixed;
    const planes = F.planes.map(([x, y, dir, len, dest], id) => ({ id, x, y, dir, len, dest, hangar: -1, mystery: false }));
    const g = a => a.map(([dest, n]) => ({ dest, n }));
    const arms = { L: g(F.L), R: g(F.R) };
    return {
      name: L.name, cols: F.cols, rows: F.rows, mask: grid(F.cols, F.rows, () => 1), mode: L.mode, planes, hangars: [],
      arms, sol: F.sol, tourists: [...arms.L, ...arms.R].reduce((s, x) => s + x.n, 0),
    };
  }

  function generate(li) {
    const L = levelDef(li);
    if (L.fixed) return fixedLevel(L);
    let best = null;
    const t0 = Date.now();
    for (let a = 0; a < 120; a++) {
      // Zeitbudget, damit der Levelstart nicht hängt.
      if (best && Date.now() - t0 > 250) break;
      // Freispielen wird mit dem Level häufiger und tiefer.
      const lv = tryGen(L, rng((li + 1) * 104729 + a * 7919), { p: Math.min(0.75, 0.12 + 0.07 * li), maxB: Math.min(3, 1 + (li >> 1)) });
      if (!lv || !solve(lv)) continue;
      if (!best || lv.planes.length > best.planes.length) best = lv;
      if (lv.planes.length >= L.planes * (L.accept || 0.9)) break;
    }
    return best;
  }

  return { SEATS, DIRS, DEST, LEVELS, RING, ENTRY, levelDef, cellsOf, pathOf, generate, createState, freeRun, tap, arrive, tick, depart, status, frontArm, solve };
})();
</script>

<script>

  ];

  let W = 0, H = 0, DPR = 1, lay = null;

  // Siegesserie: Jeder Sieg in Folge bringt fürs nächste Level einen Schlepper mehr (höchstens 3).
  // Reisepass: zählt Touristen pro Land, Stempel an festen Schwellen.
  let shells = store.get("abflug.shells", 0), built = store.get("abflug.built", 0), builtAt = -9, isleRun = 0;
  let streak = store.get("abflug.streak", 0), pass = store.get("abflug.pass", {}), tows = 0, towArmed = false, newStamps = [];
  const STAMPS = [{ n: 30, name: "Besucher" }, { n: 150, name: "Stammgast" }, { n: 500, name: "Ehrenbürger" }];
  let lv = null, S = null, vis = new Map(), flyers = [], departing = [], confetti = [], sparks = [];
  let boostUntil = -9, shout = "", tickNow = TICK;
  let ringT = 0, ended = false, shift = { L: 0, R: 0 }, gateFlash = -9, shakeT = -9, last = 0, lastPlop = 0, pulse = [], tut = null;
  const cache = {};

  const now = () => performance.now() / 1000;

  // ---------- Hilfen ----------
  function shade(hex, amt) {

  function poly(points) {
    const segs = [];
    let total = 0;
    for (let i = 1; i < points.length; i++) {
      const [ax, ay] = points[i - 1], [bx, by] = points[i];
      const l = Math.hypot(bx - ax, by - ay);

  // ---------- Flaggen ----------

      case "SE": f("#006AA7", x, y, w, h); f("#FECC00", x + w * 0.31, y, w * 0.125, h); f("#FECC00", x, y + h * 0.4, w, h * 0.2); break;

  function badgeSprite(dest, w) {

  // ---------- Flugzeuge: rundlich, mit Gesicht ----------
  function glyph(g, kind, x, y, r, fill) {

    if (!hit) return;

    if (step && (step.lock || (step.target !== undefined && hit.id !== step.target))) return;

  // ---------- Ablauf ----------

    while (ringT >= tickNow) {

    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(x + s * hw, y0); ctx.lineTo(x + s * hw, y1 - 6); ctx.stroke();
      for (let y = y0; y < y1; y += 24) { ctx.fillStyle = C.post; ctx.beginPath(); ctx.arc(x + s * hw, y, 3.4, 0, 7); ctx.fill(); }
    }
  }
  function drawBarrier(side, t) {
    const pl = lay.arms[side], arm = S.arms[side];
    const x = pl.points[0][0], y = pl.points[0][1] - 2, hw = lay.laneW / 2 + 4;
    const open = S.active === side && arm.groups.length > 0;
    const px = side === "L" ? x - hw : x + hw, dir = side === "L" ? 1 : -1;
    ctx.save(); ctx.translate(px, y);
    ctx.rotate(open ? -dir * Math.PI * 0.42 : 0);
    const len = hw * 2 - 4;
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? "#FFFFFF" : C.band; rr(ctx, dir > 0 ? (i * len) / 6 : -((i + 1) * len) / 6, -2.5, len / 6 + 0.5, 5, 2); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = C.teal; ctx.beginPath(); ctx.arc(px, y, 6, 0, 7); ctx.fill();
    ctx.fillStyle = open ? "#5BE38A" : "#FF5A4E"; ctx.beginPath(); ctx.arc(px, y, 3.2, 0, 7); ctx.fill();
  }

  function drawGates(t) {
    const { gy0, gatesH, slotW, slotH, gates, gc } = lay, I = lay.island;
    ctx.fillStyle = asphaltPat(); ctx.fillRect(I.x, gy0, I.w, gatesH + 16);
    ctx.setLineDash([10, 8]); ctx.strokeStyle = C.line; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(I.x + 10, lay.laneY); ctx.lineTo(I.x + I.w - 10, lay.laneY); ctx.stroke(); ctx.setLineDash([]);
    const flash = t - gateFlash < 0.6 ? 1 - (t - gateFlash) / 0.6 : 0;
    gates.forEach((g, i) => {
      const x = g.x - slotW / 2 + 4, y = gy0 + 6, w = slotW - 8;
      const locked = i >= S.gateCount;
      ctx.fillStyle = locked ? "rgba(0,0,0,.18)" : flash ? `rgba(255,111,97,${0.45 * flash + 0.06})` : "rgba(255,255,255,.07)";
      rr(ctx, x, y, w, slotH + 6, 10); ctx.fill();
      ctx.setLineDash([6, 5]); ctx.strokeStyle = locked ? "rgba(255,255,255,.3)" : "rgba(255,255,255,.8)"; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
      ctx.font = `800 12px ${FONT}`; ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.fillText("A" + (i + 1), x + 6, y + 3);
      const id = S.gates[i];
      const p = id === null ? null : S.planes[id];
      const docked = p && p.where !== "taxi";
      // Fluggastbrücke: fährt aus, sobald ein Flugzeug steht
      const bx = g.x + slotW * 0.3, doorY = docked ? g.y - p.len * gateC(p) * 0.22 : gy0 + 10;
      ctx.fillStyle = "rgba(0,0,0,.22)"; rr(ctx, bx - 3, gy0, 12, doorY - gy0 + 8, 4); ctx.fill();
      ctx.fillStyle = PASTEL[i % PASTEL.length]; rr(ctx, bx - 6, gy0 - 2, 12, doorY - gy0 + 6, 4); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.fillRect(bx - 4, gy0, 3, doorY - gy0);
      if (locked) {
        ctx.font = `800 24px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillText("+", g.x, g.y + 4);
      }
      if (!docked) return;
      const v = vis.get(id), dst = A.DEST[p.dest];
      const pu = pulse[i] ? Math.max(0, 1 - (t - pulse[i]) / 0.16) : 0;
      const isFull = v && v.kind === "full" && t - v.t0 > FLY + 0.1;
      const seats = A.SEATS[p.len], landed = Math.max(0, seats - p.seatsLeft - flyers.filter(f => f.gate === i).length);
      const bh = slotH - 18, bxx = x + 5, bt = y + 20;
      ctx.fillStyle = "rgba(0,0,0,.3)"; rr(ctx, bxx, bt, 5, bh, 2.5); ctx.fill();
      const fh = (bh * landed) / seats;
      if (fh > 0) { ctx.fillStyle = dst.color; rr(ctx, bxx, bt + bh - fh, 5, fh, 2.5); ctx.fill(); }
      drawPlane(g.x, g.y, -Math.PI / 2, gateC(p), p, 1, 0, 1 + 0.1 * pu);
      const gcp = gateC(p);
      // Kabine der Brücke dockt an der Tür an
      ctx.fillStyle = shade(PASTEL[i % PASTEL.length], -0.12); rr(ctx, g.x + gcp * 0.1, doorY - 5, bx - g.x - gcp * 0.1 + 6, 10, 4); ctx.fill();
      const txt = isFull ? "VOLL!" : String(seats - landed);
      const fs = 15 * (1 + 0.35 * pu);
      ctx.font = `800 ${fs.toFixed(1)}px ${FONT}`;
      const tw = Math.max(30, ctx.measureText(txt).width + 14), py = gy0 + gatesH - 22 - 3 * pu;
      ctx.fillStyle = "rgba(0,0,0,.2)"; rr(ctx, g.x - tw / 2, py + 2, tw, 19, 9.5); ctx.fill();
      ctx.fillStyle = isFull ? C.sun : dst.color; rr(ctx, g.x - tw / 2, py, tw, 19, 9.5); ctx.fill();
      ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = isFull ? C.teal : dst.text; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, g.x, py + 10.5);
    });
  }

  function drawApron(t) {
    const { ax, ay, cell: c } = lay;
    ctx.fillStyle = asphaltPat();
    for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) {
      if (S.mask[y][x]) { rr(ctx, ax + x * c - 4, ay + y * c - 4, c + 8, c + 8, 10); ctx.fill(); }
    }
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 1.3;
    for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) {
      if (S.mask[y][x]) { rr(ctx, ax + x * c + 3, ay + y * c + 3, c - 6, c - 6, 6); ctx.stroke(); }
    }
    for (const h of S.hangars) {
      const [dx, dy] = A.DIRS[h.dir];
      const hx = ax + (h.x + 0.5) * c, hy = ay + (h.y + 0.5) * c;
      let ex = h.x, ey = h.y;
      while (ex + dx >= 0 && ey + dy >= 0 && ex + dx < S.cols && ey + dy < S.rows) { ex += dx; ey += dy; }
      ctx.setLineDash([c * 0.18, c * 0.14]); ctx.strokeStyle = "rgba(255,210,63,.85)"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ax + (ex + 0.5 + dx * 0.5) * c, ay + (ey + 0.5 + dy * 0.5) * c); ctx.stroke(); ctx.setLineDash([]);
      ctx.save(); ctx.translate(hx, hy); ctx.rotate(ANG[h.dir] + Math.PI / 2);
      ctx.fillStyle = "rgba(0,0,0,.25)"; rr(ctx, -c * 0.42 + 2, -c * 0.42 + 4, c * 0.84, c * 0.84, c * 0.25); ctx.fill();
      ctx.fillStyle = "#FFB4A8"; rr(ctx, -c * 0.42, -c * 0.42, c * 0.84, c * 0.84, c * 0.25); ctx.fill();
      ctx.fillStyle = "#FFFFFF"; for (let i = 0; i < 3; i++) ctx.fillRect(-c * 0.32, -c * 0.2 + i * c * 0.18, c * 0.64, c * 0.07);
      ctx.fillStyle = "#33414D"; rr(ctx, -c * 0.26, -c * 0.47, c * 0.52, c * 0.18, 4); ctx.fill();
      ctx.restore();
      if (h.queue.length) {
        const r = Math.max(9, c * 0.22);
        ctx.fillStyle = C.teal; ctx.beginPath(); ctx.arc(hx + c * 0.3, hy + c * 0.3, r, 0, 7); ctx.fill();
        ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = C.sun; ctx.font = `800 ${Math.round(r * 1.25)}px ${FONT}`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(h.queue.length, hx + c * 0.3, hy + c * 0.3 + 1);
      }
    }
    const arrows = [];
    for (const p of S.planes) {
      if (p.where !== "apron") continue;
      const v = vis.get(p.id), [dx, dy] = A.DIRS[p.dir];
      let { x, y } = planeCenter(p), alpha = 1, ang = ANG[p.dir];
      if (v && v.kind === "bump") {
        const s = Math.min(1, (t - v.t0) / 0.32), o = Math.sin(s * Math.PI) * v.dist;
        x += dx * o; y += dy * o; ang += Math.sin(s * Math.PI * 4) * 0.06 * (1 - s);
      }
      if (v && v.kind === "spawn") { const s = Math.min(1, (t - v.t0) / 0.4), o = (1 - s) * c * 1.4; x -= dx * o; y -= dy * o; alpha = s; }
      drawPlane(x, y, ang, c, p, alpha);
      arrows.push([x + dx * (p.len * c * 0.46 + c * 0.2), y + dy * (p.len * c * 0.46 + c * 0.2), ang, alpha]);
    }
    // Pfeil vor jeder Nase: zeigt die Rollrichtung, auch bei dunklen Flugzeugen.
    const sz = c * 0.2, nudge = Math.sin(t * 4) * c * 0.04;
    for (const [x, y, ang, alpha] of arrows) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(ang); ctx.translate(nudge, 0);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(-sz * 0.5, -sz * 0.75); ctx.lineTo(sz * 0.4, 0); ctx.lineTo(-sz * 0.5, sz * 0.75);
      ctx.strokeStyle = C.ink; ctx.lineWidth = sz * 0.75; ctx.stroke();
      ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = sz * 0.4; ctx.stroke();
      ctx.restore();
    }
  }

  function drawTutorial(t) {
    const step = tut && TUT[tut.step];
    if (!step || step.target === undefined) return;
    const p = S.planes[step.target];
    if (p.where !== "apron") return;
    const { x, y } = planeCenter(p), c = lay.cell;
    const k = 1 + Math.sin(t * 5) * 0.08;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 4; ctx.setLineDash([8, 6]); ctx.lineDashOffset = -t * 20;
    ctx.beginPath(); ctx.ellipse(x, y, (p.len * c * 0.55 + 6) * k, (c * 0.62) * k, ANG[p.dir], 0, 7); ctx.stroke();
    ctx.restore();
    const by = y - c * 0.9 - Math.abs(Math.sin(t * 5)) * 10;
    ctx.fillStyle = C.band; ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 3; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(x, by + 14); ctx.lineTo(x - 13, by); ctx.lineTo(x - 6, by); ctx.lineTo(x - 6, by - 16);
    ctx.lineTo(x + 6, by - 16); ctx.lineTo(x + 6, by); ctx.lineTo(x + 13, by); ctx.closePath();
    ctx.stroke(); ctx.fill();
  }

  // ---------- Hinweise und Karten ----------
  let toastTimer = 0, hintTimer = 0;
  function toast(msg, ms = 1100) {
    const el = $("#toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), ms);
  }
  function showHint(html, seconds) {
    const el = $("#hint"); el.innerHTML = html; el.hidden = false;
    clearTimeout(hintTimer);
    if (seconds) hintTimer = setTimeout(hideHint, seconds * 1000);
  }
  function hideHint() { $("#hint").hidden = true; }
  function showCard(html) { $("#card").innerHTML = html; $("#overlay").hidden = false; }

  $("#lvlBtn").addEventListener("click", () => {
    if (!$("#overlay").hidden) return;
    const n = Math.max(10, Math.ceil((maxLevel + 1) / 5) * 5), risk = streak > 0 && inProgress();
    const btns = Array.from({ length: n }, (_, i) => `<button data-l="${i}" ${i > maxLevel ? "disabled" : ""} class="${i === levelIdx ? "cur" : ""}" aria-label="Level ${i + 1}: ${A.levelDef(i).name}">${i + 1}</button>`).join("");
    showCard(`
      <div class="eyebrow">Abflugtafel</div>
      <h2>Level wählen</h2>
      ${risk ? `<p class="small">Ein Levelwechsel beendet deine Siegesserie von ${streak}.</p>` : ""}
      <div class="levels">${btns}</div>
      <div class="actions"><button class="btn" id="isleBtn">Deine Insel</button><button class="btn alt" id="closeBtn">Zurück zum Spiel</button></div>`);
    $("#isleBtn").addEventListener("click", () => showIsle());
    $(".levels .cur")?.scrollIntoView({ block: "nearest" });
    $("#card").querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => { if (risk) setStreak(0); startLevel(+b.dataset.l); }));
    $("#closeBtn").addEventListener("click", () => ($("#overlay").hidden = true));
  });
  $("#restartBtn").addEventListener("click", () => {
    if (!$("#overlay").hidden) return;
    if (!(streak > 0 && inProgress())) return startLevel(levelIdx);
    showCard(`
      <div class="eyebrow">Level ${levelIdx + 1}</div>
      <h2>Neu starten?</h2>
      <p>Deine Siegesserie von ${streak} geht dabei verloren.</p>
      <div class="actions"><button class="btn" id="stayBtn">Weiterspielen</button><button class="btn alt" id="againBtn">Neu starten</button></div>`);
    $("#stayBtn").addEventListener("click", () => ($("#overlay").hidden = true));
    $("#againBtn").addEventListener("click", () => { setStreak(0); startLevel(levelIdx); });
  });
  $("#towBtn").addEventListener("click", () => {
    audioInit();
    if (tows <= 0 || ended || tut) return;
    towArmed = !towArmed; syncTow();
    if (towArmed) showHint("<b>Schlepper bereit.</b> Tippe ein zugeparktes Flugzeug an. Er zieht es direkt ans Gate.", 0); else hideHint();
  });
  $("#passBtn").addEventListener("click", () => { if ($("#overlay").hidden) showPass(); });
  function syncMute() { $("#muteWave").style.opacity = muted ? 0 : 1; $("#muteBtn").setAttribute("aria-label", muted ? "Ton an" : "Ton aus"); }
  $("#muteBtn").addEventListener("click", () => { muted = !muted; store.set("abflug.muted", muted); syncMute(); audioInit(); });

  // ---------- Ton: Steeldrum ----------
  let ac = null;
  function audioInit() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (ac.state === "suspended") ac.resume();
  }
  function tone(freq, dur, type = "sine", vol = 0.12, slide = 1, delay = 0) {
    if (muted || !ac) return;
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(freq * slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function steel(f, dur = 0.4, vol = 0.08, delay = 0) {
    if (muted || !ac) return;
    const t0 = ac.currentTime + delay, g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    g.connect(ac.destination);
    [[1, 1], [2, 0.42], [3, 0.12], [4.2, 0.07]].forEach(([m, a]) => {
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(f * m, t0); og.gain.value = a;
      o.connect(og).connect(g); o.start(t0); o.stop(t0 + dur + 0.05);
    });
  }
  const sfx = {
    go: () => { steel(330, 0.25, 0.06); steel(494, 0.3, 0.05, 0.06); },
    bump: () => tone(190, 0.2, "sine", 0.12, 0.55),
    // Tonleiter steigt mit dem Füllstand: je voller, desto höher.
    board(fill) {
      const steps = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
      steel(392 * 2 ** (steps[Math.min(steps.length - 1, Math.floor(fill * steps.length))] / 12), 0.32, 0.07);
    },
    full: () => [523, 659, 784, 1046].forEach((f, i) => steel(f, 0.5, 0.08, i * 0.07)),
    whoosh() {
      if (muted || !ac) return;
      const len = 1.0, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t0 = ac.currentTime;
      src.buffer = buf; f.type = "bandpass"; f.Q.value = 1.2;
      f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(2400, t0 + len);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
      src.connect(f).connect(g).connect(ac.destination); src.start(t0);
    },
    win: () => [523, 659, 784, 659, 784, 1046].forEach((f, i) => steel(f, 0.45, 0.08, i * 0.13)),
    lose: () => [392, 330, 262].forEach((f, i) => steel(f, 0.5, 0.07, i * 0.16)),
    tow: () => { tone(110, 0.4, "triangle", 0.12, 1.6); steel(392, 0.3, 0.05, 0.12); steel(587, 0.35, 0.05, 0.2); },
    build: () => { tone(120, 0.15, "triangle", 0.2, 0.6); [523, 659, 784, 1046, 1318].forEach((f, i) => steel(f, 0.5, 0.07, 0.08 + i * 0.08)); },
    whistle: () => { tone(2300, 0.1, "sine", 0.05, 1.04); tone(2300, 0.22, "sine", 0.05, 0.96, 0.13); },
    stamp: () => { tone(150, 0.12, "triangle", 0.22, 0.5); steel(1046, 0.5, 0.08, 0.1); steel(1318, 0.6, 0.07, 0.2); },
  };

  // ---------- Start ----------
  function frame() {
    const t = now(), dt = Math.min(0.05, t - last || 0);
    last = t;
    // Karte offen mitten im Level: Spiel hält an.
    if ($("#overlay").hidden || ended) update(t, dt);
    draw(t);
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize", layout);
  syncMute();
  window.claude?.hot?.snapshot?.(() => ({ levelIdx }));
  const boot = data => {
    startLevel(data?.levelIdx ?? store.get("abflug.level", 0));
    last = now();
    requestAnimationFrame(frame);
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
