<style>
/* Layout: Insel-Flughafen. Oben Terminal mit Wartering, Mitte Gates, unten Vorfeld, rundherum Meer. */
:root {
  --sea: #1FA9C6;
  --teal: #0E5E6F;
  --teal-dark: #08414D;
  --sun: #FFE066;
  --coral: #FF6F61;
  --coral-dark: #C9483D;
  --ink: #16323A;
  --muted: #4E6A72;
  --card: #FFFDF7;
  --font-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--font-body); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
#app { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; display: block; }
#safe { position: absolute; width: 0; height: 0; padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; }
.hud { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: calc(8px + env(safe-area-inset-top, 0px)) 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.hud > * { pointer-events: auto; zoom: var(--z, 1); }
.board { display: flex; align-items: baseline; gap: 8px; min-width: 0; background: var(--teal); color: var(--sun); border: 0; border-radius: 14px; padding: 1px 13px 2px; font-family: var(--font-display); box-shadow: 0 3px 0 var(--teal-dark); cursor: pointer; }
.board-k { font-weight: 800; font-size: 21px; }
.board-v { font-weight: 700; font-size: 15px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-right { display: flex; gap: 6px; }
.chip, .icon { height: 36px; border: 0; border-radius: 12px; background: var(--teal); color: #FFFFFF; font-family: var(--font-display); font-weight: 800; font-size: 16px; box-shadow: 0 3px 0 var(--teal-dark); cursor: pointer; display: grid; place-items: center; }
.chip { padding: 0 11px; color: var(--sun); white-space: nowrap; }
.chip:disabled { opacity: .4; cursor: default; }
.icon { width: 36px; }
.icon svg { width: 18px; height: 18px; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.toast { zoom: var(--z, 1); position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); background: var(--coral); color: #FFFFFF; font-family: var(--font-display); font-weight: 800; font-size: 21px; padding: 6px 20px; border-radius: 999px; box-shadow: 0 4px 0 var(--coral-dark); pointer-events: none; white-space: nowrap; }
.hint { zoom: var(--z, 1); box-sizing: border-box; position: absolute; left: 50%; top: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(calc(92vw / var(--z, 1)), 400px); background: linear-gradient(180deg, #FFF9EA, #FFEFC9); color: var(--ink); border: 3px solid #FFFFFF; border-radius: 18px; padding: 10px 16px 10px 46px; font-size: 15px; font-weight: 700; line-height: 1.4; text-align: left; pointer-events: none; box-shadow: 0 6px 0 rgba(8,65,77,.18), 0 10px 24px rgba(8,65,77,.25); }
/* Kleine Sonne links im Hinweis */
.hint::before { content: ""; position: absolute; left: 12px; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 50%; background: radial-gradient(circle, #FFE066 0 55%, transparent 57%), repeating-conic-gradient(#FFC400 0 12deg, transparent 12deg 30deg); }
.hint b { color: var(--coral); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, rgba(31,169,198,.35), rgba(8,65,77,.6)); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* Karten wie ein Strandkiosk: Markise oben, Sand in der Mitte, Wellen unten. */
.card { position: relative; overflow: hidden; width: 100%; max-width: 340px; max-height: calc((100vh - 32px) / var(--z, 1)); overflow-y: auto; zoom: var(--z, 1); color: var(--ink); border: 4px solid #FFFFFF; border-radius: 28px; padding: 40px 20px 30px; text-align: center; box-shadow: 0 8px 0 rgba(8,65,77,.25), 0 18px 40px rgba(8,65,77,.35);
  background: radial-gradient(circle at 12px 0, transparent 11px, #7FD9B8 12px) left bottom / 24px 12px repeat-x, linear-gradient(180deg, #FFF9EA 0%, #FFEDC2 100%); }
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 26px;
  background: repeating-linear-gradient(90deg, #FF8F7E 0 22px, #FFFFFF 22px 44px, #7FD9B8 44px 66px, #FFFFFF 66px 88px, #FFD56B 88px 110px, #FFFFFF 110px 132px);
  -webkit-mask: radial-gradient(circle 11px at 11px 14px, #000 98%, transparent) 0 0 / 22px 26px repeat-x, linear-gradient(#000 0 0) 0 0 / 100% 14px no-repeat;
  mask: radial-gradient(circle 11px at 11px 14px, #000 98%, transparent) 0 0 / 22px 26px repeat-x, linear-gradient(#000 0 0) 0 0 / 100% 14px no-repeat; }
.card .eyebrow { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 13px; color: var(--sun); background: var(--teal); border-radius: 999px; padding: 2px 12px; box-shadow: 0 2px 0 var(--teal-dark); }
.card h2 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.05; color: var(--teal); margin: 8px 0 10px; text-wrap: balance; text-shadow: 0 2px 0 #FFFFFF; }
.card p { margin: 0 0 16px; font-size: 15px; line-height: 1.45; color: #34525A; }
.actions { display: grid; gap: 10px; }
.btn { height: 48px; border: 0; border-radius: 16px; font-family: var(--font-display); font-weight: 800; font-size: 20px; cursor: pointer; background: var(--coral); color: #FFFFFF; box-shadow: 0 4px 0 var(--coral-dark); }
.btn.alt { background: #FFFFFF; color: var(--teal); box-shadow: 0 4px 0 #E3C98F; }
.btn { border-radius: 999px; }
.tabs { display: flex; gap: 6px; justify-content: center; margin: -2px 0 12px; }
.tabs button { border: 0; border-radius: 999px; padding: 6px 14px; font-family: var(--font-display); font-weight: 800; font-size: 15px; background: #FFFFFF; color: var(--teal); box-shadow: 0 2px 0 #E3C98F; cursor: pointer; }
.tabs button.on { background: var(--teal); color: var(--sun); box-shadow: 0 2px 0 var(--teal-dark); }
.levels button.storm:not(:disabled) { background: #3E4A8C; box-shadow: 0 3px 0 #262E5E; }
.levels button.storm::before { content: "Sturm"; font-family: var(--font-body); font-size: 9px; color: #C9D3FF; }
.levels button.done { background: #FFC400; color: var(--teal-dark); box-shadow: 0 3px 0 #D99A00; }
.levels button.done small { color: var(--teal-dark); }
.medal { width: 76px; height: 76px; margin: 10px auto 2px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; font-size: 42px; background: radial-gradient(circle at 35% 30%, #FFF3A0, #FFC400 60%, #D99A00); border: 4px solid #FFFFFF; box-shadow: 0 4px 0 #B07A00; animation: starpop .5s cubic-bezier(.3,1.6,.5,1) both; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
.levels button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 14px; background: var(--teal); color: var(--sun); font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1; box-shadow: 0 3px 0 var(--teal-dark); cursor: pointer; display: grid; place-content: center; gap: 2px; }
.levels button small { font-size: 10px; letter-spacing: 0; color: #FFB4A8; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.stars3 { display: flex; justify-content: center; gap: 4px; margin: 0 0 12px; }
.stars3 div { flex: 1; max-width: 92px; display: grid; justify-items: center; gap: 2px; }
.stars3 span { font-size: 44px; line-height: 1; color: #E8DCC0; }
.stars3 .on span { color: #FFC400; text-shadow: 0 3px 0 #D99A00; animation: starpop .45s cubic-bezier(.3,1.6,.5,1) both; }
.stars3 small { font-size: 11px; font-weight: 800; color: #B5A57F; line-height: 1.2; }
.stars3 .on small { color: var(--teal); }
@media (prefers-reduced-motion: reduce) { .stars3 .on span { animation: none; } }
.loot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 10px; }
.chip-l { background: #FFFFFF; border-radius: 14px; padding: 7px 8px; box-shadow: 0 2px 0 #EBD49E; font-size: 13px; font-weight: 700; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.chip-l b { font-family: var(--font-display); font-size: 20px; color: var(--teal); line-height: 1.1; }
.chip-l.shell b { color: var(--coral); }
.chip-l small { font-size: 11px; line-height: 1.25; }
.chip-l .dots { display: flex; gap: 4px; }
.chip-l .dots i { width: 18px; height: 6px; border-radius: 3px; background: #E8DCC0; }
.chip-l .dots i.on { background: var(--coral); }
.loot-stamps { display: flex; align-items: center; justify-content: center; gap: 5px; margin: 0 0 12px; font-size: 12px; font-weight: 800; color: var(--muted); }
.loot-stamps img { width: 24px; height: 16px; border-radius: 3px; box-shadow: 0 0 0 2px #FFFFFF; }
.loot-stamps span { margin-left: 4px; }
.minis { display: flex; gap: 8px; }
.progress { margin: 0 0 12px; }
.progress .meter { margin: 0 0 6px; height: 16px; border-radius: 8px; background: #E8DCC0; }
.progress-l { display: flex; align-items: baseline; justify-content: center; gap: 6px; font-weight: 800; font-size: 14px; color: var(--muted); }
.progress-l b { font-family: var(--font-display); font-size: 24px; color: var(--coral); }
.progress-l span { font-size: 12px; font-weight: 700; }
.loot.one { grid-template-columns: 1fr; }
.chip-l.warn { background: #FFE3DE; box-shadow: 0 2px 0 #F2B3A8; }
.chip-l.warn b { color: var(--coral-dark); }
.mini { flex: 1; min-height: 46px; border: 0; border-radius: 16px; background: #FFFFFF; color: var(--teal); font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1.1; box-shadow: 0 3px 0 #E3C98F; cursor: pointer; display: grid; place-content: center; padding: 4px 6px; }
.mini small { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--muted); }
.mini.hot { background: var(--sun); box-shadow: 0 3px 0 #D9B330; position: relative; }
.mini.hot::after { content: ""; position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--coral); border: 2px solid #FFFFFF; }
.shop-row.sub { margin-left: 18px; background: #FFF6DA; }
.shop-row .tier { color: var(--coral); letter-spacing: 1px; }
.levels button:disabled { background: #E1E9E8; color: #9FB2B5; box-shadow: none; cursor: default; }
.levels button.cur { outline: 3px solid var(--coral); outline-offset: 2px; }
.levels { max-height: 44vh; overflow-y: auto; padding: 5px; }
.chip svg { width: 22px; height: 16px; margin-right: 4px; }
.chip.tow { display: flex; align-items: center; }
.chip.armed { background: var(--coral); color: #FFFFFF; box-shadow: 0 3px 0 var(--coral-dark); }
.card p.small { font-size: 14px; margin-bottom: 14px; }
.meter { height: 12px; border-radius: 6px; background: #E1E9E8; margin: -6px 0 16px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--coral); border-radius: 6px; }
.newstamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0 0 14px; }
.newstamps span { display: flex; align-items: center; gap: 6px; background: #FFF1C2; border-radius: 10px; padding: 3px 9px 3px 4px; font-size: 13px; font-weight: 800; }
.newstamps img, .stamp img, .stamp .q { width: 30px; height: 20px; border-radius: 3px; flex: none; }
.pass { display: grid; gap: 7px; max-height: 50vh; overflow-y: auto; margin-bottom: 16px; text-align: left; }
.stamp { display: flex; gap: 10px; align-items: center; background: #FFFFFF; border-radius: 14px; padding: 7px 10px; box-shadow: 0 2px 0 #EBD49E; }
.stamp > div { flex: 1; min-width: 0; }
.stamp b { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 15px; }
.stamp .stars { color: var(--coral); letter-spacing: 1px; }
.stamp small { display: block; font-size: 12px; color: var(--muted); }
.stamp .bar { height: 5px; background: #E1E9E8; border-radius: 3px; margin-top: 3px; overflow: hidden; }
.stamp .bar span { display: block; height: 100%; background: var(--coral); }
.stamp.locked { opacity: .55; }
.btn:disabled { opacity: .5; cursor: default; }
.shop { display: grid; gap: 6px; max-height: 52vh; overflow-y: auto; margin-bottom: 14px; text-align: left; }
.shop h3 { font-family: var(--font-display); font-size: 15px; color: var(--muted); margin: 6px 0 0; }
.shop-row { display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 14px; padding: 6px 6px 6px 12px; box-shadow: 0 2px 0 #EBD49E; }
.shop-row span { flex: 1; font-weight: 800; font-size: 15px; }
.shop-row small { display: block; font-weight: 700; font-size: 12px; color: var(--muted); }
.shop-row button { height: 36px; min-width: 96px; border: 0; border-radius: 10px; background: var(--coral); color: #FFFFFF; font-family: var(--font-display); font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 var(--coral-dark); cursor: pointer; }
.shop-row button.alt { background: #E6F5F2; color: var(--teal); box-shadow: 0 3px 0 #C4DED9; }
.shop-row button { border-radius: 999px; }
.shop-row button:disabled { opacity: .45; cursor: default; }
.stamp .q { display: grid; place-items: center; background: #C9D6D8; color: #FFFFFF; font-weight: 800; }
</style>

<div id="app">
  <canvas id="cv" aria-label="Spielfeld: Terminal, Gates und Vorfeld"></canvas>
  <div id="safe"></div>
  <header class="hud">
    <button id="lvlBtn" class="board" aria-label="Level wählen"><span id="lvlNum" class="board-k">1</span><span id="lvlTxt" class="board-v">Erster Flug</span></button>
    <div class="hud-right">
      <button id="towBtn" class="chip tow" aria-label="Schlepper benutzen" hidden><svg viewBox="0 0 22 16" fill="currentColor"><rect x="1" y="5" width="13" height="6" rx="2"/><rect x="8" y="1" width="6" height="5" rx="1.5"/><path d="M14 8h6v2h-6z"/><circle cx="4.5" cy="12.5" r="2.5"/><circle cx="11.5" cy="12.5" r="2.5"/></svg><span id="towN">1</span></button>
      <button id="passBtn" class="icon" aria-label="Reisepass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10.5" r="3"/><path d="M9 17h6"/></svg></button>
      <button id="restartBtn" class="icon" aria-label="Level neu starten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
      <button id="muteBtn" class="icon" aria-label="Ton aus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
    </div>
  </header>
  <div id="toast" class="toast" hidden></div>
  <div id="hint" class="hint" hidden></div>
  <div id="overlay" class="overlay" hidden><div class="card" id="card"></div></div>
</div>

<script id="logic">
// Spiellogik ohne DOM. Wird auch von den Tests geladen.
window.Abflug = (() => {
  const SEATS = { 2: 16, 3: 24, 4: 40 };
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const DKEYS = ["U", "D", "L", "R"];
  const DEST = [
    { id: "ES", name: "Spanien", color: "#FFC400", text: "#2A2205" },
    { id: "IT", name: "Italien", color: "#18B04F", text: "#FFFFFF" },
    { id: "GR", name: "Griechenland", color: "#29C2F2", text: "#06283A" },
    { id: "TR", name: "Türkei", color: "#F0302A", text: "#FFFFFF" },
    { id: "JP", name: "Japan", color: "#F5F3EC", text: "#B0162A" },
    { id: "SE", name: "Schweden", color: "#1F57F0", text: "#FFFFFF" },
    { id: "NL", name: "Niederlande", color: "#FF7A00", text: "#2A1604" },
    { id: "MX", name: "Mexiko", color: "#FF4FA6", text: "#FFFFFF" },
    { id: "FR", name: "Frankreich", color: "#9A4DF5", text: "#FFFFFF" },
    { id: "QA", name: "Katar", color: "#00B5A5", text: "#FFFFFF" },
    { id: "EG", name: "Ägypten", color: "#3A3F4A", text: "#FFFFFF" },
  ];

  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const grid = (c, r, f) => Array.from({ length: r }, (_, y) => Array.from({ length: c }, (_, x) => !!f(x, y)));
  const art = rows => rows.map(s => [...s].map(ch => ch === "#"));
  // Maske vergrößern: kompakte Flugzeuge erlauben ein dichteres Vorfeld.
  const up = (m, f) => grid(Math.round(m[0].length * f), Math.round(m.length * f), (x, y) => m[Math.floor(y / f)][Math.floor(x / f)]);

  // Wartering im Terminal: RING Reihen à 4 Plätze, Position 0 ist der Ausgang zu den Gates.
  const RING = 20, ENTRY = { L: 7, R: 13 };

  const LEVELS = [
    // Tutorial: festes Level. Flugzeug 0 ist frei, 1 wird von 2 blockiert.
    { name: "Erster Flug", tutorial: true, dests: 3, planes: 8, mode: "seq", fixed: {
      cols: 5, rows: 6,
      planes: [
        [1, 1, "U", 2, 1], [2, 3, "R", 3, 0], [3, 4, "D", 2, 3], [0, 5, "L", 2, 0],
        [4, 0, "U", 3, 3], [3, 1, "R", 2, 1], [2, 5, "D", 2, 0], [0, 1, "U", 2, 3],
      ],
      L: [[1, 16], [3, 16], [0, 24], [3, 24]],
      R: [[1, 16], [0, 16], [3, 16], [0, 16]],
      sol: [0, 2, 1, 4, 5, 3, 7, 6],
    } },
    { name: "Inselhüpfer", mask: grid(8, 10, () => 1), dests: 5, planes: 24, mode: "seq" },
    { name: "Kokosbucht", mask: grid(9, 12, (x, y) => !((x === 0 || x === 8) && (y === 0 || y === 11))), dests: 6, planes: 32, mode: "seq" },
    { name: "Schranken", mask: grid(10, 13, () => 1), dests: 6, planes: 40, mode: "alt" },
    { name: "Jumbo", mask: up(art([
      "....##....",
      "...####...",
      "...####...",
      "..######..",
      "##########",
      "##########",
      ".########.",
      "...####...",
      "...####...",
      "...####...",
      "..######..",
      "..######..",
    ]), 1.3), dests: 7, planes: 44, mode: "alt" },
    { name: "Tropennebel", mask: grid(13, 13, (x, y) => Math.abs(x - 6) + Math.abs(y - 6) <= 7), dests: 7, planes: 44, mode: "alt", mystery: 0.25 },
    { name: "Hangar", mask: grid(11, 14, () => 1), dests: 8, planes: 52, mode: "alt", hangars: 1, hangarSize: 4 },
    { name: "Koffer", mask: up(art([
      "...####...",
      "...#..#...",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
      "##########",
    ]), 1.3), dests: 8, planes: 56, mode: "alt", mystery: 0.25, hangars: 1, hangarSize: 4 },
    { name: "Weltreise", mask: grid(13, 15, (x, y) => ((x - 6) / 6.6) ** 2 + ((y - 7) / 7.6) ** 2 <= 1), dests: 9, planes: 52, mode: "alt", mystery: 0.3 },
    { name: "Tower", mask: up(art([
      "..######..",
      ".########.",
      "##########",
      "##########",
      ".########.",
      "...####...",
      "...####...",
      "...####...",
      "..######..",
      ".########.",
      "##########",
      "##########",
      "##########",
    ]), 1.3), dests: 10, planes: 60, mode: "alt", mystery: 0.3, hangars: 2, hangarSize: 4 },
  ];

  // Nach den festen Levels geht es endlos weiter: Form, Ziele und Größe kommen aus dem Level-Index.
  const SHAPES = [
    (c, r) => grid(c, r, () => 1),
    (c, r) => grid(c, r, (x, y) => Math.abs(x - (c - 1) / 2) / (c / 2) + Math.abs(y - (r - 1) / 2) / (r / 2) <= 1.2),
    (c, r) => grid(c, r, (x, y) => ((x - (c - 1) / 2) / (c / 2 + 0.3)) ** 2 + ((y - (r - 1) / 2) / (r / 2 + 0.3)) ** 2 <= 1),
    (c, r) => grid(c, r, (x, y) => !((x < c * 0.25 || x >= c * 0.75) && (y < r * 0.2 || y >= r * 0.8))),
    (c, r) => grid(c, r, (x, y) => x < c * 0.4 || x >= c * 0.6 || (y >= r * 0.3 && y < r * 0.7)),
  ];
  const ISLES = ["Muschelriff", "Mangohain", "Flamingo", "Passatwind", "Lagune", "Riffkante", "Sonnendeck", "Hängematte", "Ananas", "Seestern", "Korallen", "Leuchtturm", "Papagei", "Schildkröte", "Brandung"];
  const defs = {};
  function levelDef(li) {
    if (li < LEVELS.length) return LEVELS[li];
    if (defs[li]) return defs[li];
    const k = li - LEVELS.length, r = rng(li * 31337 + 7), round = Math.floor(k / ISLES.length);
    const c = 12 + ((r() * 3) | 0), rows = 14 + ((r() * 3) | 0), h = r() < 0.5 ? 1 + (r() < 0.3 ? 1 : 0) : 0;
    return (defs[li] = {
      name: ISLES[k % ISLES.length] + (round ? " " + (round + 1) : ""),
      mask: SHAPES[(r() * SHAPES.length) | 0](c, rows),
      dests: Math.min(DEST.length, 9 + (k >> 2)), planes: 50 + Math.min(14, k >> 1), mode: "alt",
      mystery: Math.min(0.4, 0.25 + k * 0.01), hangars: h, hangarSize: 4, accept: 0.8,
    });
  }

  // Flugzeug: (x, y) ist die Nase, der Rumpf liegt entgegen der Richtung.
  function cellsOf(p) {
    const [dx, dy] = DIRS[p.dir], out = [];
    for (let k = 0; k < p.len; k++) out.push([p.x - k * dx, p.y - k * dy]);
    return out;
  }
  function pathOf(p, cols, rows) {
    const [dx, dy] = DIRS[p.dir], out = [];
    let x = p.x + dx, y = p.y + dy;
    while (x >= 0 && y >= 0 && x < cols && y < rows) { out.push([x, y]); x += dx; y += dy; }
    return out;
  }

  // Rückwärts bauen: Jedes neue Flugzeug braucht freie Bahn an allen bisherigen vorbei.
  // Damit ist die umgekehrte Reihenfolge immer eine gültige Lösung fürs Vorfeld.
  function tryGen(L, r, dig) {
    const rows = L.mask.length, cols = L.mask[0].length;
    const occ = Array.from({ length: rows }, () => Array(cols).fill(null));
    const inMask = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows && L.mask[y][x];
    const hangars = [];
    for (let h = 0; h < (L.hangars || 0); h++) {
      for (let t = 0; t < 400; t++) {
        const x = (r() * cols) | 0, y = (r() * rows) | 0, dir = DKEYS[(r() * 4) | 0];
        const [dx, dy] = DIRS[dir];
        if (!inMask(x, y) || !inMask(x + dx, y + dy) || !inMask(x + 2 * dx, y + 2 * dy)) continue;
        const ray = [];
        let cx = x, cy = y, ok = true;
        while (cx >= 0 && cy >= 0 && cx < cols && cy < rows) {
          if (occ[cy][cx] !== null) { ok = false; break; }
          ray.push([cx, cy]); cx += dx; cy += dy;
        }
        if (!ok || ray.length < 4) continue;
        occ[y][x] = "H";
        ray.slice(1).forEach(([a, b]) => (occ[b][a] = "R"));
        hangars.push({ x, y, dir });
        break;
      }
    }
    const hangarPlanes = hangars.length * (L.hangarSize || 0);
    const target = L.planes - hangarPlanes;
    const lens = [2, 2, 2, 2, 3, 3, 3, 4, 4];
    const base = [];
    for (let t = 0; t < 14000 && base.length < target; t++) {
      const p = { x: (r() * cols) | 0, y: (r() * rows) | 0, dir: DKEYS[(r() * 4) | 0], len: lens[(r() * lens.length) | 0] };
      const cells = cellsOf(p);
      if (!cells.every(([a, b]) => inMask(a, b) && occ[b][a] === null)) continue;
      if (pathOf(p, cols, rows).some(([a, b]) => occ[b][a] === "H" || typeof occ[b][a] === "number")) continue;
      const i = base.length;
      base.push(p);
      cells.forEach(([a, b]) => (occ[b][a] = i));
    }
    if (base.length < 3) return null;

    const planes = base.map((p, i) => ({ id: i, ...p, hangar: -1, mystery: false }));
    hangars.forEach((h, hi) => {
      const [dx, dy] = DIRS[h.dir];
      h.queue = [];
      for (let k = 0; k < L.hangarSize; k++) {
        const p = { id: planes.length, x: h.x + 2 * dx, y: h.y + 2 * dy, dir: h.dir, len: 2, hangar: hi, mystery: false };
        planes.push(p); h.queue.push(p.id);
      }
    });
    // Ziele verteilen: Ein oder zwei "versteckte" Ziele bekommen nur Flugzeuge, die anfangs
    // zugeparkt sind. So muss man genau die zuerst gefragten Länder erst freispielen.
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const st0 = createState({ cols, rows, mask: L.mask, mode: L.mode, planes: planes.map(p => ({ ...p, dest: 0 })), hangars, arms: { L: [], R: [] } });
    const freeIds = new Set(st0.planes.filter(p => p.where === "apron" && freeRun(st0, p) < 0).map(p => p.id));
    const perm = shuffle([...Array(L.dests).keys()]);
    const hidden = perm.slice(0, L.dests >= 5 ? 2 : 1), open = perm.slice(hidden.length);
    const per = Math.max(1, Math.round(planes.length / L.dests));
    const blocked = shuffle(planes.filter(p => p.hangar < 0 && !freeIds.has(p.id)).map(p => p.id));
    const used = new Set();
    hidden.forEach(d => { for (let k = 0; k < per && blocked.length; k++) { const id = blocked.pop(); planes[id].dest = d; used.add(id); } });
    const rest = shuffle(planes.filter(p => !used.has(p.id)).map(p => p.id));
    rest.forEach((id, k) => (planes[id].dest = k < open.length ? open[k] : open[(r() * open.length) | 0]));
    if (new Set(planes.map(p => p.dest)).size < L.dests) return null;
    if (L.mystery) base.forEach((_, i) => (planes[i].mystery = r() < L.mystery));

    const built = buildQueue({ cols, rows, mask: L.mask, mode: L.mode, planes, hangars }, r, dig.p, dig.maxB);
    if (!built) return null;
    const { sol, seq } = built;
    const arms = { L: [], R: [] };
    if (L.mode === "seq") {
      const total = seq.reduce((s, g) => s + g.n, 0);
      let acc = 0;
      seq.forEach(g => { (acc < total / 2 ? arms.L : arms.R).push(g); acc += g.n; });
    } else {
      seq.forEach((g, k) => (k % 2 ? arms.R : arms.L).push(g));
    }
    return {
      name: L.name, cols, rows, mask: L.mask, mode: L.mode, planes,
      hangars: hangars.map(h => ({ x: h.x, y: h.y, dir: h.dir, queue: h.queue })),
      arms, sol, tourists: seq.reduce((s, g) => s + g.n, 0),
    };
  }

  // Alle Flugzeuge, die weg müssen, bevor p frei ist. null, wenn ein Hangar-Flugzeug im Weg steht.
  function blockersOf(st, p) {
    const need = new Set(), stack = [p.id], m = occMap(st);
    while (stack.length) {
      const q = st.planes[stack.pop()];
      for (const [x, y] of pathOf(q, st.cols, st.rows)) {
        const o = m.get(x + "," + y);
        if (o === undefined) continue;
        if (o < 0 || st.planes[o].hangar >= 0) return null;
        if (!need.has(o)) { need.add(o); stack.push(o); }
      }
    }
    return need;
  }

  // Schlange bauen, indem ein Spiel mit vier Gates simuliert wird. Mit Wahrscheinlichkeit dig
  // kommen zuerst Touristen für ein zugeparktes Flugzeug: Man muss es freispielen und die
  // Blocker so lange an den Gates parken. Die Reihenfolge der Abflüge ist die Lösung.
  function buildQueue(base, r, dig, maxB) {
    const st = createState({ ...base, arms: { L: [], R: [] } });
    const need = {}, sol = [], seq = [];
    st.planes.forEach(p => (need[p.id] = SEATS[p.len]));
    const freeGates = () => st.gates.slice(0, st.gateCount).filter(g => g === null).length;
    const send = id => { if (!tap(st, id).ok) throw new Error("send"); arrive(st, id); sol.push(id); };
    const emit = (id, n) => {
      const p = st.planes[id];
      n = Math.min(n, need[id]); need[id] -= n;
      const last = seq[seq.length - 1];
      if (last && last.dest === p.dest) last.n += n; else seq.push({ dest: p.dest, n });
      if (!need[id]) depart(st, id);
    };
    let first = true;
    for (let guard = 0; guard < 20000; guard++) {
      if (st.planes.every(p => p.where === "gone")) return { sol, seq };
      const fg = freeGates();
      const onApron = st.planes.filter(p => p.where === "apron");
      if (fg >= 2 && onApron.length && (first || r() < dig)) {
        const cands = [];
        // Nur Ziele, für die gerade kein Flugzeug frei steht oder am Gate wartet.
        const easy = new Set(st.planes.filter(q => (q.where === "apron" && freeRun(st, q) < 0) || (q.where === "gate" && need[q.id] > 0)).map(q => q.dest));
        for (const p of onApron) {
          if (easy.has(p.dest)) continue;
          const b = blockersOf(st, p);
          if (b && b.size <= maxB && b.size + 1 <= fg) cands.push([p, b]);
        }
        if (cands.length) {
          const most = Math.max(...cands.map(c => c[1].size));
          const top = cands.filter(c => c[1].size === most);
          const [p, b] = top[(r() * top.length) | 0];
          const todo = new Set(b);
          for (let g2 = 0; todo.size && g2 < 50; g2++) {
            for (const id of [...todo]) if (freeRun(st, st.planes[id]) < 0) { send(id); todo.delete(id); }
          }
          if (todo.size) return null;
          send(p.id);
          emit(p.id, r() < 0.5 ? need[p.id] : 8);
          first = false;
          continue;
        }
      }
      const atGate = st.planes.filter(p => p.where === "gate" && need[p.id] > 0);
      const free = onApron.filter(p => freeRun(st, p) < 0);
      if (fg > 0 && free.length && (!atGate.length || r() < 0.3)) { send(free[(r() * free.length) | 0].id); continue; }
      if (atGate.length) { emit(atGate[(r() * atGate.length) | 0].id, r() < 0.55 ? 8 : 16); first = false; continue; }
      return null;
    }
    return null;
  }

  // opts.lookahead (Leuchtturm): Unbekannte Ziele zeigen sich schon, wenn höchstens so viele Flugzeuge
  // im Weg stehen. true zählt als 1, ab 99 ist alles sichtbar.
  function createState(lv, opts = {}) {
    // opts.fog (Herausforderung Nebel): Alle Ziele bleiben verborgen, bis der Weg frei ist.
    const planes = lv.planes.map(p => ({ ...p, where: p.hangar >= 0 ? "hangar" : "apron", seatsLeft: SEATS[p.len], gate: -1, revealed: !p.mystery && !opts.fog }));
    const hangars = lv.hangars.map(h => ({ x: h.x, y: h.y, dir: h.dir, queue: [...h.queue] }));
    hangars.forEach(h => { planes[h.queue.shift()].where = "apron"; });
    const st = {
      cols: lv.cols, rows: lv.rows, mask: lv.mask, mode: lv.mode, planes, hangars,
      gates: [null, null, null, null, null], gateCount: 4, lookahead: opts.lookahead === true ? 1 : opts.lookahead || 0,
      arms: { L: { groups: lv.arms.L.map(g => ({ ...g })), taken: 0 }, R: { groups: lv.arms.R.map(g => ({ ...g })), taken: 0 } },
      active: "L", boarded: 0,
      ring: new Array(RING * 4).fill(-1), off: 0,
    };
    if (!st.arms.L.groups.length) st.active = "R";
    reveal(st);
    return st;
  }
  function occMap(st) {
    const m = new Map();
    st.planes.forEach(p => { if (p.where === "apron") cellsOf(p).forEach(([x, y]) => m.set(x + "," + y, p.id)); });
    st.hangars.forEach(h => m.set(h.x + "," + h.y, -1));
    return m;
  }
  // -1: Weg frei. Sonst Anzahl freier Felder bis zum Hindernis.
  function freeRun(st, p, m = occMap(st)) {
    const path = pathOf(p, st.cols, st.rows);
    for (let k = 0; k < path.length; k++) if (m.has(path[k][0] + "," + path[k][1])) return k;
    return -1;
  }
  function reveal(st) {
    const m = occMap(st);
    st.planes.forEach(p => {
      if (p.where !== "apron" || p.revealed) return;
      if (freeRun(st, p, m) < 0) p.revealed = true;
      else if (st.lookahead >= 99) p.revealed = true;
      else if (st.lookahead) { const b = blockersOf(st, p); if (b && b.size <= st.lookahead) p.revealed = true; }
    });
  }
  // tow: Der Schlepper zieht das Flugzeug heraus, auch wenn der Weg zugeparkt ist.
  function tap(st, id, tow = false) {
    const p = st.planes[id];
    if (!p || p.where !== "apron") return { ok: false, reason: "none" };
    const k = freeRun(st, p);
    if (k >= 0 && !tow) return { ok: false, reason: "blocked", free: k };
    let g = -1;
    for (let i = 0; i < st.gateCount; i++) if (st.gates[i] === null) { g = i; break; }
    if (g < 0) return { ok: false, reason: "gates" };
    p.where = "taxi"; p.gate = g; p.revealed = true; st.gates[g] = id;
    let spawned = null;
    if (p.hangar >= 0) {
      const h = st.hangars[p.hangar];
      if (h.queue.length) { spawned = h.queue.shift(); st.planes[spawned].where = "apron"; }
    }
    reveal(st);
    return { ok: true, gate: g, spawned };
  }
  function arrive(st, id) { const p = st.planes[id]; if (p.where === "taxi") p.where = "gate"; }
  function frontArm(st) {
    let a = st.arms[st.active];
    if (!a.groups.length) {
      const o = st.active === "L" ? "R" : "L";
      if (st.arms[o].groups.length) { st.active = o; a = st.arms[o]; }
    }
    return a.groups.length ? a : null;
  }
  function rowAt(st, pos) { return (((pos - st.off) % RING) + RING) % RING; }
  function gatePlaneFor(st, dest) {
    for (let i = 0; i < st.gateCount; i++) {
      const id = st.gates[i];
      if (id === null) continue;
      const p = st.planes[id];
      if (p.where === "gate" && p.dest === dest && p.seatsLeft > 0) return p;
    }
    return null;
  }
  // Ein Schritt: Der Ring rückt eine Reihe weiter. Am Ausgang steigt ein, wer ein passendes
  // Flugzeug am Gate hat. Am offenen Zulauf rücken Touristen in freie Plätze nach.
  function tick(st) {
    st.off = (st.off + 1) % RING;
    const boards = [];
    const j0 = rowAt(st, 0);
    for (let c = 0; c < 4; c++) {
      const k = j0 * 4 + c, d = st.ring[k];
      if (d < 0) continue;
      const p = gatePlaneFor(st, d);
      if (!p) continue;
      st.ring[k] = -1; p.seatsLeft--; st.boarded++;
      if (!p.seatsLeft) p.where = "full";
      boards.push({ plane: p.id, dest: d, lane: c, full: !p.seatsLeft });
    }
    let entered = null;
    const a = frontArm(st);
    if (a) {
      const side = st.active, j = rowAt(st, ENTRY[side]), before = a.taken;
      for (let c = 0; c < 4 && a.groups.length; c++) {
        const k = j * 4 + c;
        if (st.ring[k] >= 0) continue;
        const grp = a.groups[0];
        st.ring[k] = grp.dest; grp.n--; a.taken++;
        if (!grp.n) {
          a.groups.shift();
          const o = side === "L" ? "R" : "L";
          if ((st.mode === "alt" && st.arms[o].groups.length) || !a.groups.length) { st.active = o; break; }
        }
      }
      if (a.taken > before) entered = { side, before, after: a.taken };
    }
    return { boards, entered };
  }
  function depart(st, id) { const p = st.planes[id]; st.gates[p.gate] = null; p.where = "gone"; }
  function status(st) {
    const queued = st.arms.L.groups.length + st.arms.R.groups.length;
    if (!queued && st.ring.every(d => d < 0) && st.planes.every(p => p.where === "gone")) return "win";
    if (st.planes.some(p => p.where === "taxi" || p.where === "full")) return "busy";
    const gd = new Set();
    for (let i = 0; i < st.gateCount; i++) if (st.gates[i] !== null) gd.add(st.planes[st.gates[i]].dest);
    if (st.ring.some(d => d >= 0 && gd.has(d))) return "boarding";
    for (let i = 0; i < st.gateCount; i++) if (st.gates[i] === null) return "play";
    if (queued && st.ring.some(d => d < 0)) return "filling";
    return "lose";
  }

  // Spielt die Lösungsreihenfolge stur durch: so früh wie möglich losrollen, sonst Ring laufen lassen.
  function solve(lv) {
    const st = createState(lv);
    let idx = 0;
    for (let n = 0; n < 400000; n++) {
      st.planes.forEach(p => { if (p.where === "full") depart(st, p.id); });
      const s = status(st);
      if (s === "win") return true;
      if (s === "lose") return false;
      if (idx < lv.sol.length) {
        const r = tap(st, lv.sol[idx]);
        if (r.ok) { arrive(st, lv.sol[idx]); idx++; continue; }
        if (r.reason !== "gates") return false;
      }
      tick(st);
    }
    return false;
  }

  function fixedLevel(L) {
    const F = L.fixed;
    const planes = F.planes.map(([x, y, dir, len, dest], id) => ({ id, x, y, dir, len, dest, hangar: -1, mystery: false }));
    const g = a => a.map(([dest, n]) => ({ dest, n }));
    const arms = { L: g(F.L), R: g(F.R) };
    return {
      name: L.name, cols: F.cols, rows: F.rows, mask: grid(F.cols, F.rows, () => 1), mode: L.mode, planes, hangars: [],
      arms, sol: F.sol, tourists: [...arms.L, ...arms.R].reduce((s, x) => s + x.n, 0),
    };
  }

  // Jedes fünfte Level ab Level 5 ist ein Sturm-Level: mehr und tiefer zugeparkte Ziele.
  const isStorm = li => li >= 4 && (li + 1) % 5 === 0;
  function generate(li) {
    const L = levelDef(li), storm = isStorm(li);
    if (L.fixed) return fixedLevel(L);
    let best = null;
    const t0 = Date.now();
    for (let a = 0; a < 120; a++) {
      // Zeitbudget, damit der Levelstart nicht hängt.
      if (best && Date.now() - t0 > 250) break;
      // Freispielen wird mit dem Level häufiger und tiefer.
      const p = Math.min(0.75, 0.12 + 0.07 * li), maxB = Math.min(3, 1 + (li >> 1));
      const lv = tryGen(L, rng((li + 1) * 104729 + a * 7919), storm ? { p: Math.min(0.9, p + 0.2), maxB: maxB + 1 } : { p, maxB });
      if (!lv || !solve(lv)) continue;
      if (!best || lv.planes.length > best.planes.length) best = lv;
      if (lv.planes.length >= L.planes * (L.accept || 0.9)) break;
    }
    if (best) best.storm = storm;
    return best;
  }

  return { SEATS, DIRS, DEST, LEVELS, RING, ENTRY, levelDef, isStorm, cellsOf, pathOf, generate, createState, freeRun, tap, arrive, tick, depart, status, frontArm, solve };
})();
</script>

<script>
(() => {
  const A = window.Abflug;
  const $ = s => document.querySelector(s);
  const cv = $("#cv"), ctx = cv.getContext("2d");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const ANG = { U: -Math.PI / 2, D: Math.PI / 2, L: Math.PI, R: 0 };
  // Ring läuft gemächlich. Neben dem Vorfeld stehen Fluglotse (links, bremst) und Pilot (rechts, gibt Gas).
  // Antippen wirkt kurz, Festhalten so lange man hält.
  const TICK = 0.3, TICK_FAST = 0.1, TICK_SLOW = 0.75, BOOST = 1.3, FLY = 0.5, FULL_WAIT = 1.0;
  // Symbol pro Reiseziel, damit Touristen und Flugzeuge nicht nur über die Farbe zuzuordnen sind.
  const GLYPH = { ES: "star", IT: "ring", GR: "drop", TR: "moon", JP: "dot", SE: "plus", NL: "square", MX: "heart", FR: "diamond", QA: "x", EG: "tri" };
  const SHOUTS = {

    fast: ["Volle Kraft!", "Einsteigen, zack!", "Wir sind spät dran!", "Abflug!"],
  };
  const FONT = '"Baloo 2", "Nunito", system-ui, sans-serif';
  // Insel-Palette: Meer, Sand, Pastell-Häuser, Korallenrot, Sonnengelb.
  const C = {
    sea1: "#3FD3E0", sea2: "#1494B8", sand: "#F8E4B2", sand2: "#EFCF8C", floor: "#FFF6E4", lane: "#F5DFAF",
    band: "#FF6F61", post: "#1F7F90", asphalt: "#6E7C8A", line: "#FFD23F", teal: "#0E5E6F", sun: "#FFE066", ink: "#16323A",
  };
  const PASTEL = ["#FF8F7E", "#7FD9B8", "#FFD56B", "#8FCBFF", "#C9A6FF"];
  const SKIN = ["#F6D2B0", "#E7B58B", "#C68A5E", "#9A6542", "#FADFC7"];
  const INTRO = {
    1: "<b>Tipp:</b> Der <b>Pilot</b> rechts macht die Touristen schneller, der <b>Fluglotse</b> links bremst sie. Antippen oder festhalten.",
    3: "<b>Neu: Schranken.</b> Die beiden Eingänge öffnen abwechselnd, Gruppe für Gruppe.",
    5: "<b>Neu: Ziel unbekannt.</b> Graue Flugzeuge zeigen ihr Ziel, sobald ihr Weg frei ist.",

  // ---------- Ablauf ----------

  function finish(won) {

    if (tut) { tut = null; hideHint(); }
    setTimeout(() => {
      store.set("abflug.pass", pass);

    }
  }
  function drawBarrier(side, t) {

  function drawGates(t) {

  function drawApron(t) {
    const { ax, ay, cell: c } = lay;
    ctx.fillStyle = asphaltPat();
    for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) {

  function syncMute() { $("#muteWave").style.opacity = muted ? 0 : 1; $("#muteBtn").setAttribute("aria-label", muted ? "Ton an" : "Ton aus"); }

  // ---------- Ton: Steeldrum ----------
  let ac = null;

  // Mischpult: Effekte und Musik laufen über einen gemeinsamen Hall, das klingt weicher und luftiger.
  let bus = null;

      src.connect(f).connect(g).connect(out()); src.start(t0);
    },
    win: () => [523, 659, 784, 659, 784, 1046].forEach((f, i) => steel(f, 0.45, 0.08, i * 0.13)),
    lose: () => [392, 330, 262].forEach((f, i) => steel(f, 0.5, 0.07, i * 0.16)),
    tow: () => { tone(110, 0.4, "triangle", 0.12, 1.6); steel(392, 0.3, 0.05, 0.12); steel(587, 0.35, 0.05, 0.2); },
    build: () => { tone(120, 0.15, "triangle", 0.2, 0.6); [523, 659, 784, 1046, 1318].forEach((f, i) => steel(f, 0.5, 0.07, 0.08 + i * 0.08)); },
    whistle: () => { tone(2300, 0.1, "sine", 0.05, 1.04); tone(2300, 0.22, "sine", 0.05, 0.96, 0.13); },
    engine: () => { tone(90, 0.5, "sawtooth", 0.05, 2.2); steel(784, 0.3, 0.05, 0.15); },
    stamp: () => { tone(150, 0.12, "triangle", 0.22, 0.5); steel(1046, 0.5, 0.08, 0.1); steel(1318, 0.6, 0.07, 0.2); },
  };

  // ---------- Musik: live erzeugt, Stil je nach Lage ----------
  // Eigene Kompositionen im Stil, keine Stücke aus anderen Spielen, daher lizenzfrei.
  // son:   entspannter kubanischer Son für normale Level (Clave 3-2, Bongos, Tumbao-Bass, Gitarre, Marimba)
  // house: Tropical House für Herausforderungen (Four-on-the-floor, Offbeat-Bass, Marimba-Stabs, Fläche)
  // funk:  Brasil-Funk mit Tamborzão-Groove für Sturm-Level
  // Pilot beschleunigt die Musik, der Fluglotse bremst sie und dämpft die Höhen.
  let musicOn = store.get("abflug.music", true), mus = null, noiseBuf = null, musicStyle = "son";
  const STYLES = {
    son: { bpm: 92, sub: 2, swing: 0.1, prog: [[0, "maj"], [5, "maj"], [7, "dom"], [0, "maj"], [9, "min"], [2, "min"], [7, "dom"], [0, "maj"]] },
    house: { bpm: 108, sub: 2, swing: 0, prog: [[9, "min"], [5, "maj"], [0, "maj"], [7, "maj"]] },
    funk: { bpm: 128, sub: 4, swing: 0, prog: [[4, "min"], [4, "min"], [0, "maj"], [2, "maj"]] },
  };
  const TONES = { maj: [0, 4, 7], min: [0, 3, 7], dom: [0, 4, 7, 10] };
  const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  const CLAVE = [[0, 3, 6], [2, 4]];
  const mtof = m => 440 * 2 ** ((m - 69) / 12);
  function setMusicStyle(st) {
    if (st === musicStyle) return;
    musicStyle = st;
    if (mus) { mus.step = 0; mus.mel = 4; }
  }
  function musicStart() {
    if (!ac || !bus || mus || !musicOn || muted) return;
    mus = { next: ac.currentTime + 0.15, step: 0, mel: 4, timer: setInterval(musicTick, 25) };
  }
  function musicStop() { if (mus) { clearInterval(mus.timer); mus = null; } }
  function musicDuck(level, secs) {
    if (!bus) return;
    const g = bus.musGain.gain, t = ac.currentTime;
    g.cancelScheduledValues(t); g.setTargetAtTime(0.8 * level, t, 0.08); g.setTargetAtTime(0.8, t + secs, 0.5);
  }
  function musicTick() {
    if (!mus || ac.state !== "running") return;
    const S2 = STYLES[musicStyle], sp = speedOn(now());
    const tempo = sp === "fast" ? 1.15 : sp === "slow" ? 0.85 : 1;
    bus.musLp.frequency.setTargetAtTime(sp === "slow" ? 900 : 16000, ac.currentTime, 0.15);
    const base = 60 / (S2.bpm * tempo) / S2.sub;
    while (mus.next < ac.currentTime + 0.2) {
      PLAY[musicStyle](mus.step, mus.next, base);
      mus.next += base * (S2.swing ? (mus.step % 2 ? 1 - S2.swing : 1 + S2.swing) : 1);
      mus.step++;
    }
  }
  function env(t, peak, attack, decay) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    g.connect(bus.mus);
    return g;
  }
  function osc(type, f, t, dur, to, f2) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.5);
    o.connect(to); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, v, hp, dur, band) {
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const src = ac.createBufferSource(), f = ac.createBiquadFilter();
    src.buffer = noiseBuf; f.type = band ? "bandpass" : "highpass"; f.frequency.value = hp; if (band) f.Q.value = 1.2;
    src.connect(f).connect(env(t, v, 0.004, dur)); src.start(t); src.stop(t + dur + 0.05);
  }
  function lp(freq, to) { const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq; f.connect(to); return f; }
  const inst = {
    clave: t => { const g = env(t, 0.07, 0.002, 0.06); osc("sine", 2500, t, 0.08, g); osc("sine", 1650, t, 0.08, g); },
    shaker: (t, v) => noise(t, v, 7000, 0.06),
    hat: (t, v, d = 0.05) => noise(t, v, 8500, d),
    clap: (t, v) => { noise(t, v, 1500, 0.12, true); noise(t + 0.012, v * 0.7, 1500, 0.1, true); },
    kick: (t, v) => { osc("sine", 140, t, 0.3, env(t, v, 0.003, 0.28), 48); osc("triangle", 280, t, 0.04, env(t, v * 0.3, 0.001, 0.03), 120); },
    bongo: (t, f, v) => osc("sine", f, t, 0.14, env(t, v, 0.002, 0.12), f * 0.82),
    conga: (t, v, f = 210) => osc("sine", f, t, 0.3, env(t, v, 0.003, 0.26), f * 0.83),
    // Bass eine Oktave höher und mit Obertönen, damit er auch aus Handylautsprechern hörbar ist.
    bass(f, t, d, v = 0.15) {
      const to = lp(900, env(t, v, 0.012, d));
      osc("triangle", f, t, d, to); osc("sawtooth", f, t, d, lp(600, env(t, v * 0.35, 0.012, d)));
    },
    sub808(f, t, d, v = 0.17) {
      osc("sine", f * 1.5, t, d, env(t, v, 0.005, d), f);
      osc("square", f * 2, t, d * 0.5, lp(700, env(t, v * 0.18, 0.005, d * 0.5)), f * 1.4);
    },
    pluck(f, t, v, d = 0.42) {
      const g = env(t, v, 0.004, d), f1 = ac.createBiquadFilter();
      f1.type = "lowpass"; f1.frequency.setValueAtTime(2600, t); f1.frequency.exponentialRampToValueAtTime(500, t + d * 0.7); f1.connect(g);
      osc("sawtooth", f, t, d + 0.03, f1);
    },
    marimba(f, t, v) {
      osc("sine", f, t, 0.7, env(t, v, 0.003, 0.65));
      osc("sine", f * 4, t, 0.1, env(t, v * 0.25, 0.002, 0.06));
    },
    pad(fs, t, d, v) { const to = lp(1100, env(t, v, d * 0.3, d * 0.7)); fs.forEach(f => { osc("sawtooth", f, t, d, to); osc("sawtooth", f * 1.006, t, d, to); }); },
  };
  // Marimba-Phrase: wandert in kleinen Schritten über die Tonleiter und landet auf Akkordtönen.
  function melody(r, ct, pos, t, chance, v) {
    if (Math.random() >= chance) return;
    mus.mel = Math.max(0, Math.min(SCALE.length - 1, mus.mel + [-2, -1, -1, 1, 1, 2][(Math.random() * 6) | 0]));
    let n = SCALE[mus.mel];
    if (pos === 0) { const want = ct.map(c => (r + c) % 12); while (!want.includes(n % 12) && mus.mel > 0) n = SCALE[--mus.mel]; }
    inst.marimba(mtof(72 + n), t, v);
  }
  const PLAY = {
    son(step, t, e8) {
      const P = STYLES.son.prog, bar = Math.floor(step / 8), pos = step % 8, [r, q] = P[bar % P.length], [nr] = P[(bar + 1) % P.length], ct = TONES[q];
      if (CLAVE[bar % 2].includes(pos)) inst.clave(t);
      inst.shaker(t, pos % 2 ? 0.045 : 0.02);
      inst.bongo(t, pos % 2 ? 540 : 400, pos === 0 ? 0.08 : 0.045);
      if (pos === 6 || pos === 7) inst.conga(t, 0.07);
      // Tumbao: Quinte auf „2 und“, Grundton des nächsten Akkords schon auf der 4
      if (pos === 3) inst.bass(mtof(48 + r + 7), t, e8 * 2.6);
      if (pos === 6) inst.bass(mtof(48 + nr), t, e8 * 3.2);
      const gp = [0, 2, 3, 5, 6].indexOf(pos);
      if (gp >= 0) inst.pluck(mtof(60 + r + ct[[0, 2, 1, 2, 1][gp] % ct.length]), t, 0.035);
      if ([0, 1, 4, 5].includes(bar % 8)) melody(r, ct, pos, t, pos % 2 ? 0.3 : 0.6, 0.07);
    },
    house(step, t, e8) {
      const P = STYLES.house.prog, bar = Math.floor(step / 8), pos = step % 8, [r, q] = P[bar % P.length], ct = TONES[q];
      if (pos % 2 === 0) inst.kick(t, 0.22);
      else { inst.hat(t, 0.05, 0.08); inst.bass(mtof(45 + r), t, e8 * 0.9, 0.13); }
      if (pos === 2 || pos === 6) inst.clap(t, 0.06);
      inst.shaker(t, 0.012);
      // Typische 3-3-2-Stabs der Marimba über dem Akkord
      if ([0, 3, 6].includes(pos)) ct.forEach((c, i) => inst.marimba(mtof(69 + r + c), t + i * 0.008, 0.035));
      if (pos === 0) inst.pad(ct.map(c => mtof(57 + r + c)), t, e8 * 8, 0.018);
      if (bar % 4 >= 2) melody(r, ct, pos, t, pos % 2 ? 0.2 : 0.45, 0.05);
    },
    funk(step, t, e16) {
      const P = STYLES.funk.prog, bar = Math.floor(step / 16), pos = step % 16, [r, q] = P[bar % P.length], ct = TONES[q];
      // Tamborzão: Bumm – – Bumm – – – Bumm – – Bumm … mit Tak auf 5 und 13
      if ([0, 3, 7, 10].includes(pos)) { inst.kick(t, 0.24); inst.sub808(mtof(40 + r), t, e16 * 2.5, 0.12); }
      if (pos === 4 || pos === 12) inst.clap(t, 0.075);
      if ([6, 14, 15].includes(pos)) inst.conga(t, 0.08, pos === 15 ? 260 : 220);
      if (pos % 2 === 0) inst.hat(t, pos % 4 ? 0.025 : 0.04, 0.03);
      if ([2, 8, 11].includes(pos)) inst.pluck(mtof(64 + r + ct[pos % ct.length]), t, 0.03, 0.25);
      if (bar % 4 === 3 && pos % 2 === 0) melody(r, ct, pos, t, 0.4, 0.045);
    },
  };

  // ---------- Start ----------
  function frame() {
    const t = now(), dt = Math.min(0.05, t - last || 0);
    last = t;
    // Karte offen mitten im Level: Spiel hält an.
    if (($("#overlay").hidden && !peeking) || ended) update(t, dt);
    draw(t);
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize", layout);
  syncMute();
  window.claude?.hot?.snapshot?.(() => ({ levelIdx }));
  const boot = data => {
    startLevel(data?.levelIdx ?? store.get("abflug.level", 0));
    last = now();
    requestAnimationFrame(frame);
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
